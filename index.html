<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUTIK JAVA ANALYZER V4</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:7px;
 background:#101820;
 color:white;
 font-family:Arial,sans-serif;
 font-size:12px;
}

h3{
 color:#00e5ff;
 font-size:16px;
 margin:5px 0 12px;
}

button{
 width:100%;
 padding:10px 3px;
 margin:6px 0;
 background:#00bcd4;
 color:#000;
 border:0;
 font-weight:bold;
 font-size:12px;
}

input{
 width:100%;
 margin:10px 0;
 color:white;
}

.box{
 background:#263238;
 border:1px solid #00bcd4;
 padding:8px;
 margin-top:8px;
 overflow-wrap:anywhere;
 word-break:break-word;
 line-height:1.6;
}

.label{
 color:#00e5ff;
 font-weight:bold;
}

.good{color:#00ff90}
.bad{color:#ff5252}
.small{font-size:10px;color:#bbb}
</style>
</head>

<body>

<h3>RUTIK JAVA ANALYZER V4</h3>

<p>Select Java Application (.jar)</p>

<input type="file" id="picker" accept=".jar">

<button onclick="analyze()">ANALYZE JAR</button>

<button onclick="resetApp()">RESET</button>

<div class="box" id="status">
Waiting for JAR file...
</div>

<div class="box" id="output">
Java application information will appear here.
</div>

<script>

var picker = document.getElementById("picker");
var statusBox = document.getElementById("status");
var outputBox = document.getElementById("output");

function status(msg){
 statusBox.innerHTML = msg;
}

function output(msg){
 outputBox.innerHTML = msg;
}

function readPart(file,start,end){

 return new Promise(function(resolve,reject){

  var reader = new FileReader();

  reader.onload = function(e){
   resolve(new Uint8Array(e.target.result));
  };

  reader.onerror = function(){
   reject(new Error("FileReader failed"));
  };

  reader.onabort = function(){
   reject(new Error("File reading aborted"));
  };

  try{
   reader.readAsArrayBuffer(file.slice(start,end));
  }catch(err){
   reject(err);
  }

 });
}

function u16(a,p){
 return a[p] | (a[p+1] << 8);
}

function u32(a,p){
 return (
  a[p] |
  (a[p+1] << 8) |
  (a[p+2] << 16) |
  (a[p+3] << 24)
 ) >>> 0;
}

function findSignature(data,sig){

 for(var i=data.length-22;i>=0;i--){

  if(
   data[i]===0x50 &&
   data[i+1]===0x4b &&
   data[i+2]===0x05 &&
   data[i+3]===0x06
  ){
   return i;
  }

 }

 return -1;
}

function parseManifest(raw){

 var text = raw
  .replace(/\r\n/g,"\n")
  .replace(/\r/g,"\n")
  .replace(/\n[ \t]/g,"");

 var lines = text.split("\n");
 var data = {};

 lines.forEach(function(line){

  var i = line.indexOf(":");

  if(i > 0){

   var key = line.substring(0,i).trim();
   var value = line.substring(i+1).trim();

   data[key] = value;

  }

 });

 return data;
}

function showManifest(data,raw){

 var html = "";

 var fields = [
  ["MIDlet Name","MIDlet-Name"],
  ["MIDlet Version","MIDlet-Version"],
  ["MIDlet Vendor","MIDlet-Vendor"],
  ["Java Configuration","MicroEdition-Configuration"],
  ["Java Profile","MicroEdition-Profile"],
  ["JAR URL","MIDlet-Jar-URL"],
  ["JAR Size","MIDlet-Jar-Size"],
  ["Created By","Created-By"],
  ["Main Class","Main-Class"]
 ];

 fields.forEach(function(item){

  var value = data[item[1]];

  if(value){
   html +=
    "<span class='label'>" + item[0] +
    ":</span><br>" + value + "<br><br>";
  }

 });

 html += "<span class='label'>MIDlet Entries:</span><br>";

 var found = false;

 Object.keys(data).forEach(function(key){

  if(/^MIDlet-\d+$/.test(key)){

   found = true;

   html += data[key] + "<br>";

  }

 });

 if(!found){
  html += "No MIDlet entries found.<br>";
 }

 html += "<br><span class='label'>Full Manifest:</span><br>";
 html += raw.replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/\n/g,"<br>");

 output(html);

}

async function analyze(){

 var file = picker.files && picker.files[0];

 if(!file){
  status("<span class='bad'>Please select a JAR file.</span>");
  return;
 }

 output("Analyzing...");
 status("Step 1: Reading ZIP directory...");

 try{

  var tailSize = Math.min(file.size,65557);

  var tailStart = file.size-tailSize;

  var tail = await readPart(file,tailStart,file.size);

  status("Step 2: Searching ZIP signature...");

  var eocd = findSignature(tail);

  if(eocd < 0){
   throw new Error("ZIP End Directory not found.");
  }

  var disk = u16(tail,eocd+4);
  var centralDisk = u16(tail,eocd+6);
  var entries = u16(tail,eocd+10);
  var centralSize = u32(tail,eocd+12);
  var centralOffset = u32(tail,eocd+16);

  if(disk !== 0 || centralDisk !== 0){
   throw new Error("Multi-disk ZIP is not supported.");
  }

  if(entries === 65535 || centralOffset === 4294967295){
   throw new Error("ZIP64 archive is not supported.");
  }

  status("Step 3: Reading ZIP file list...");

  var central = await readPart(
   file,
   centralOffset,
   centralOffset+centralSize
  );

  var position = 0;
  var manifest = null;

  for(var n=0;n<entries;n++){

   if(u32(central,position)!==0x02014b50){
    throw new Error("Invalid ZIP directory entry.");
   }

   var method = u16(central,position+10);
   var compressedSize = u32(central,position+20);
   var uncompressedSize = u32(central,position+24);

   var nameLength = u16(central,position+28);
   var extraLength = u16(central,position+30);
   var commentLength = u16(central,position+32);

   var localOffset = u32(central,position+42);

   var nameBytes = central.slice(
    position+46,
    position+46+nameLength
   );

   var name = new TextDecoder().decode(nameBytes);

   if(name.toUpperCase()==="META-INF/MANIFEST.MF"){

    manifest = {
     method:method,
     compressedSize:compressedSize,
     uncompressedSize:uncompressedSize,
     localOffset:localOffset
    };

    break;
   }

   position += 46+nameLength+extraLength+commentLength;

  }

  if(!manifest){
   throw new Error("META-INF/MANIFEST.MF not found.");
  }

  status("Step 4: Reading Manifest...");

  var header = await readPart(
   file,
   manifest.localOffset,
   manifest.localOffset+30
  );

  if(u32(header,0)!==0x04034b50){
   throw new Error("Invalid local ZIP header.");
  }

  var localNameLength = u16(header,26);
  var localExtraLength = u16(header,28);

  var dataStart =
   manifest.localOffset+30+
   localNameLength+
   localExtraLength;

  var compressed = await readPart(
   file,
   dataStart,
   dataStart+manifest.compressedSize
  );

  var rawBytes;

  if(manifest.method===0){

   rawBytes = compressed;

  }else if(manifest.method===8){

   status("Step 5: Decompressing Manifest...");

   if(typeof DecompressionStream==="undefined"){
    throw new Error("DecompressionStream not supported.");
   }

   var stream = new Blob([compressed])
    .stream()
    .pipeThrough(new DecompressionStream("deflate-raw"));

   var response = new Response(stream);

   rawBytes = new Uint8Array(
    await response.arrayBuffer()
   );

  }else{

   throw new Error(
    "Unsupported ZIP compression method: "+manifest.method
   );

  }

  status("<span class='good'>SUCCESS! Manifest found.</span>");

  var raw = new TextDecoder("utf-8").decode(rawBytes);

  var data = parseManifest(raw);

  showManifest(data,raw);

 }catch(error){

  status(
   "<span class='bad'>ANALYSIS FAILED</span><br>" +
   error.message
  );

  output(
   "Error Details:<br>" +
   String(error)
  );

 }

}

function resetApp(){

 picker.value = "";

 status("Waiting for JAR file...");

 output("Java application information will appear here.");

}

</script>

</body>
  </html>
