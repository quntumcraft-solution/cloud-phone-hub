<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=128, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RUTIK LIVE TV</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07142f;
    color:#fff;
    font-family:Arial,sans-serif;
    font-size:11px;
}

#app{
    width:100%;
    height:100%;
    max-width:128px;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#07142f;
    overflow:hidden;
}

.header{
    height:23px;
    min-height:23px;
    background:#073d9b;
    border-bottom:1px solid #16c9ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:#fff;
}

.header span{
    color:#00f0ff;
    margin-left:4px;
}

#screen{
    flex:1;
    min-height:0;
    overflow:hidden;
    padding:3px;
    display:flex;
    flex-direction:column;
}

.footer{
    height:17px;
    min-height:17px;
    background:#101d38;
    border-top:1px solid #168aff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6px;
    color:#00eaff;
    font-weight:bold;
    font-size:10px;
}

.title{
    height:20px;
    min-height:20px;
    background:#06469e;
    border-bottom:1px solid #00d9ff;
    padding:4px;
    font-weight:bold;
    font-size:11px;
}

.menuItem{
    height:25px;
    min-height:25px;
    margin:2px 0;
    padding:6px;
    border:1px solid #2459a5;
    background:#102957;
    font-size:11px;
}

.selected{
    background:#0879dc !important;
    border:1px solid #00efff !important;
    color:#fff;
}

.info{
    color:#00eaff;
    font-weight:bold;
    padding:4px 1px;
    font-size:10px;
}

.row{
    height:24px;
    min-height:24px;
    margin:1px 0;
    padding:5px 4px;
    background:#102957;
    border:1px solid #254f91;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:11px;
}

.row.selected{
    background:#0879dc;
    border:1px solid #00efff;
}

.smallButton{
    display:inline-block;
    padding:5px 10px;
    border:1px solid #00eaff;
    background:#123b78;
    margin:2px;
    font-weight:bold;
}

input{
    width:100%;
    height:27px;
    background:#101f43;
    border:1px solid #00cfff;
    color:white;
    padding:4px;
    font-size:11px;
    outline:none;
}

#listArea{
    flex:1;
    min-height:0;
    overflow:hidden;
}

#videoBox{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000;
}

video{
    width:100%;
    max-height:100%;
    background:#000;
}

#message{
    color:#00eaff;
    padding:5px;
    text-align:center;
}
</style>
</head>

<body>

<div id="app">

    <div class="header">
        RUTIK LIVE TV <span>● LIVE</span>
    </div>

    <div id="screen"></div>

    <div class="footer">
        <span id="leftKey">SELECT</span>
        <span id="rightKey">BACK</span>
    </div>

</div>

<script>

/* =========================
   RUTIK LIVE TV MASTER
========================= */

var screen=document.getElementById("screen");

var page="home";
var menuIndex=0;
var selectedIndex=0;
var categoryIndex=0;
var categoryStart=0;
var channelStart=0;

var channels=[];
var filteredChannels=[];
var favorites=[];

var currentChannel=null;
var currentSource="";
var previousPage="channels";

var xhr=null;

var categories=[
 ["Marathi","https://iptv-org.github.io/iptv/languages/mar.m3u"],
 ["Hindi","https://iptv-org.github.io/iptv/languages/hin.m3u"],
 ["Music","https://iptv-org.github.io/iptv/categories/music.m3u"],
 ["News","https://iptv-org.github.io/iptv/categories/news.m3u"],
 ["Sports","https://iptv-org.github.io/iptv/categories/sports.m3u"],
 ["Movies","https://iptv-org.github.io/iptv/categories/movies.m3u"],
 ["Entertainment","https://iptv-org.github.io/iptv/categories/entertainment.m3u"],
 ["Education","https://iptv-org.github.io/iptv/categories/education.m3u"],
 ["Documentary","https://iptv-org.github.io/iptv/categories/documentary.m3u"]
];

var homeItems=[
 "Indian TV",
 "Sports",
 "All Categories",
 "My Favourites",
 "Search Channel"
];

try{
    favorites=JSON.parse(localStorage.getItem("rutik_tv_favorites")||"[]");
}catch(e){
    favorites=[];
}

function saveFavorites(){
    try{
        localStorage.setItem(
            "rutik_tv_favorites",
            JSON.stringify(favorites)
        );
    }catch(e){}
}

function footer(a,b){
    document.getElementById("leftKey").innerHTML=a;
    document.getElementById("rightKey").innerHTML=b;
}

/* =========================
   HOME
========================= */

function openHome(){
    page="home";
    menuIndex=0;

    screen.innerHTML=
    '<div class="title">MAIN MENU</div>'+
    '<div id="homeList"></div>';

    renderHome();
    footer("SELECT","MENU");
}

function renderHome(){
    var box=document.getElementById("homeList");
    var html="";

    for(var i=0;i<homeItems.length;i++){
        html+='<div class="menuItem '+(i===menuIndex?'selected':'')+'">'+
        homeItems[i]+'</div>';
    }

    box.innerHTML=html;
}

function selectHome(){
    if(menuIndex===0){
        loadPlaylist(
            "Indian TV",
            "https://raw.githubusercontent.com/iptv-org/iptv/refs/heads/master/streams/in.m3u",
            "INDIA"
        );
    }
    else if(menuIndex===1){
        loadPlaylist(
            "Sports",
            "https://iptv-org.github.io/iptv/categories/sports.m3u",
            "SPORTS"
        );
    }
    else if(menuIndex===2){
        openCategories();
    }
    else if(menuIndex===3){
        openFavorites();
    }
    else if(menuIndex===4){
        openSearch();
    }
}

/* =========================
   CATEGORIES
========================= */

function openCategories(){
    page="categories";
    categoryIndex=0;
    categoryStart=0;

    renderCategories();
    footer("SELECT","BACK");
}

function renderCategories(){

    var html='<div class="title">ALL CATEGORIES</div>';
    html+='<div class="info">SELECT CATEGORY</div>';
    html+='<div id="listArea">';

    var end=categoryStart+4;
    if(end>categories.length) end=categories.length;

    for(var i=categoryStart;i<end;i++){
        html+='<div class="row '+(i===categoryIndex?'selected':'')+'">'+
        categories[i][0]+'</div>';
    }

    html+='</div>';

    html+='<div class="info">'+
    (categoryIndex+1)+' / '+categories.length+
    '  ▲▼</div>';

    screen.innerHTML=html;
}

function selectCategory(){
    var c=categories[categoryIndex];

    loadPlaylist(c[0],c[1],"CATEGORY");
}

/* =========================
   LOAD PLAYLIST
========================= */

function loadPlaylist(name,url,source){

    if(xhr){
        try{xhr.abort();}catch(e){}
    }

    page="loading";
    currentSource=source;
    selectedIndex=0;
    channelStart=0;
    channels=[];
    filteredChannels=[];

    screen.innerHTML=
    '<div class="title">'+name+'</div>'+
    '<div id="message">Loading channels...</div>';

    footer("WAIT","BACK");

    xhr=new XMLHttpRequest();

    xhr.onreadystatechange=function(){

        if(xhr.readyState===4){

            if(xhr.status===200){

                channels=parseM3U(xhr.responseText);
                filteredChannels=channels.slice(0);

                if(source==="CATEGORY"){
                    previousPage="categories";
                }else{
                    previousPage="home";
                }

                page="channels";
                renderChannels();

            }else{

                screen.innerHTML=
                '<div class="title">'+name+'</div>'+
                '<div id="message">Playlist loading failed.</div>';

                footer("RETRY","BACK");
                page="error";
            }
        }
    };

    xhr.open("GET",url,true);
    xhr.send();
}

/* =========================
   M3U PARSER
========================= */

function parseM3U(data){

    var lines=data.split(/\r?\n/);
    var result=[];
    var name="";
    var logo="";

    for(var i=0;i<lines.length;i++){

        var line=lines[i];

        if(line.indexOf("#EXTINF")===0){

            var comma=line.lastIndexOf(",");
            name=comma>=0?line.substring(comma+1).trim():"Unknown";

            var match=line.match(/tvg-logo="([^"]*)"/);
            logo=match?match[1]:"";

        }
        else if(line.indexOf("http")===0){

            result.push({
                name:name||"Unknown Channel",
                url:line.trim(),
                logo:logo
            });

            name="";
            logo="";
        }
    }

    return result;
}

/* =========================
   CHANNEL LIST
========================= */

function renderChannels(){

    page="channels";

    var total=filteredChannels.length;

    if(selectedIndex>=total){
        selectedIndex=total-1;
    }

    if(selectedIndex<0){
        selectedIndex=0;
    }

    if(selectedIndex<channelStart){
        channelStart=selectedIndex;
    }

    if(selectedIndex>=channelStart+4){
        channelStart=selectedIndex-3;
    }

    var html='<div class="title">'+currentSourceName()+'</div>';

    html+='<div class="smallButton" onclick="backAction()">BACK</div>';

    html+='<div class="info">CHANNELS: '+total+
    ' | '+(total?selectedIndex+1:0)+'/'+total+'</div>';

    html+='<div id="listArea">';

    var end=channelStart+4;
    if(end>total) end=total;

    for(var i=channelStart;i<end;i++){

        html+='<div class="row '+(i===selectedIndex?'selected':'')+'">'+
        escapeHTML(filteredChannels[i].name)+
        '</div>';
    }

    html+='</div>';

    screen.innerHTML=html;

    footer("SELECT","BACK");
}

function currentSourceName(){

    if(currentSource==="CATEGORY"){
        return categories[categoryIndex][0];
    }

    if(currentSource==="FAVOURITES"){
        return "MY FAVOURITES";
    }

    if(currentSource==="SEARCH"){
        return "SEARCH RESULTS";
    }

    return currentSource;
}

function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,function(c){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c];
    });
}

/* =========================
   PLAY CHANNEL
========================= */

function playSelected(){

    if(!filteredChannels.length) return;

    currentChannel=filteredChannels[selectedIndex];

    playChannel(currentChannel);
}

function playChannel(channel){

    page="player";

    screen.innerHTML=
    '<div class="title">'+escapeHTML(channel.name)+'</div>'+
    '<div id="videoBox">'+
    '<video id="tvVideo" controls autoplay></video>'+
    '<div id="message">Connecting...</div>'+
    '</div>'+
    '<div class="smallButton" onclick="toggleFavorite()">☆ FAV</div>';

    var video=document.getElementById("tvVideo");

    video.src=channel.url;

    video.onerror=function(){
        document.getElementById("message").innerHTML=
        "This channel may not be supported.";
    };

    video.onplaying=function(){
        document.getElementById("message").innerHTML="";
    };

    footer("FAV","BACK");
}

function stopPlayer(){
    var video=document.getElementById("tvVideo");

    if(video){
        try{
            video.pause();
            video.removeAttribute("src");
            video.load();
        }catch(e){}
    }
}

/* =========================
   FAVOURITES
========================= */

function isFavorite(channel){

    for(var i=0;i<favorites.length;i++){
        if(favorites[i].url===channel.url) return true;
    }

    return false;
}

function toggleFavorite(){

    if(!currentChannel) return;

    var found=-1;

    for(var i=0;i<favorites.length;i++){
        if(favorites[i].url===currentChannel.url){
            found=i;
            break;
        }
    }

    if(found>=0){
        favorites.splice(found,1);
    }else{
        favorites.push(currentChannel);
    }

    saveFavorites();

    if(page==="player"){
        footer("SAVED","BACK");
    }

    if(page==="channels" && currentSource==="FAVOURITES"){
        filteredChannels=favorites.slice(0);
        channels=filteredChannels.slice(0);
        renderChannels();
    }
}

function openFavorites(){

    page="channels";
    currentSource="FAVOURITES";
    channels=favorites.slice(0);
    filteredChannels=channels.slice(0);
    selectedIndex=0;
    channelStart=0;

    renderChannels();
}

/* =========================
   SEARCH
========================= */

function openSearch(){

    page="search";

    screen.innerHTML=
    '<div class="title">SEARCH CHANNEL</div>'+
    '<input id="searchInput" type="text" placeholder="Search channel...">'+
    '<div class="info">Enter channel name</div>'+
    '<div class="row" onclick="searchAll()">SEARCH ALL CHANNELS</div>';

    footer("SEARCH","BACK");

    var input=document.getElementById("searchInput");

    input.onkeydown=function(e){
        if(e.keyCode===13){
            searchChannels(input.value);
        }
    };
}

function searchChannels(q){

    q=q.toLowerCase();

    if(!q) return;

    filteredChannels=channels.filter(function(c){
        return c.name.toLowerCase().indexOf(q)>=0;
    });

    currentSource="SEARCH";
    selectedIndex=0;
    channelStart=0;

    renderChannels();
}

function searchAll(){

    page="searchloading";

    screen.innerHTML=
    '<div class="title">SEARCH</div>'+
    '<div id="message">Loading playlists...</div>';

    var all=[];
    var count=0;

    function next(){

        if(count>=categories.length){

            channels=all;
            filteredChannels=all.slice(0);

            page="search";
            screen.innerHTML=
            '<div class="title">SEARCH ALL</div>'+
            '<input id="searchInput" placeholder="Search channel...">'+
            '<div class="row" onclick="searchChannels(document.getElementById(\'searchInput\').value)">SEARCH</div>';

            footer("SEARCH","BACK");
            return;
        }

        var u=categories[count][1];
        count++;

        var x=new XMLHttpRequest();

        x.onreadystatechange=function(){

            if(x.readyState===4){

                if(x.status===200){

                    var list=parseM3U(x.responseText);

                    for(var j=0;j<list.length;j++){

                        var exists=false;

                        for(var k=0;k<all.length;k++){
                            if(all[k].url===list[j].url){
                                exists=true;
                                break;
                            }
                        }

                        if(!exists) all.push(list[j]);
                    }
                }

                next();
            }
        };

        x.open("GET",u,true);
        x.send();
    }

    next();
}

/* =========================
   NAVIGATION
========================= */

function moveUp(){

    if(page==="home"){
        menuIndex--;
        if(menuIndex<0) menuIndex=homeItems.length-1;
        renderHome();
    }

    else if(page==="categories"){

        categoryIndex--;

        if(categoryIndex<0){
            categoryIndex=categories.length-1;
        }

        if(categoryIndex<categoryStart){
            categoryStart=categoryIndex;
        }

        if(categoryIndex>=categoryStart+4){
            categoryStart=categoryIndex-3;
        }

        renderCategories();
    }

    else if(page==="channels"){

        selectedIndex--;

        if(selectedIndex<0){
            selectedIndex=filteredChannels.length-1;
        }

        renderChannels();
    }
}

function moveDown(){

    if(page==="home"){
        menuIndex++;
        if(menuIndex>=homeItems.length) menuIndex=0;
        renderHome();
    }

    else if(page==="categories"){

        categoryIndex++;

        if(categoryIndex>=categories.length){
            categoryIndex=0;
        }

        if(categoryIndex<categoryStart){
            categoryStart=categoryIndex;
        }

        if(categoryIndex>=categoryStart+4){
            categoryStart=categoryIndex-3;
        }

        renderCategories();
    }

    else if(page==="channels"){

        selectedIndex++;

        if(selectedIndex>=filteredChannels.length){
            selectedIndex=0;
        }

        renderChannels();
    }
}

/* =========================
   SELECT
========================= */

function selectAction(){

    if(page==="home"){
        selectHome();
    }

    else if(page==="categories"){
        selectCategory();
    }

    else if(page==="channels"){
        playSelected();
    }

    else if(page==="player"){
        toggleFavorite();
    }

    else if(page==="error"){
        openHome();
    }
}

/* =========================
   BACK
========================= */

function backAction(){

    if(page==="player"){

        stopPlayer();
        page="channels";
        renderChannels();

    }

    else if(page==="channels"){

        if(currentSource==="CATEGORY"){
            openCategories();
        }
        else{
            openHome();
        }
    }

    else if(page==="categories"){
        openHome();
    }

    else if(page==="search"){
        openHome();
    }

    else if(page==="loading" || page==="searchloading"){

        if(xhr){
            try{xhr.abort();}catch(e){}
        }

        openHome();
    }

    else{
        openHome();
    }
}

/* =========================
   KEYPAD
========================= */

document.onkeydown=function(e){

    e=e||window.event;

    var k=e.keyCode;

    /* UP */
    if(k===38 || k===50 || k===98){
        moveUp();
        e.preventDefault();
        return false;
    }

    /* DOWN */
    if(k===40 || k===56 || k===104){
        moveDown();
        e.preventDefault();
        return false;
    }

    /* OK / ENTER */
    if(k===13){
        selectAction();
        e.preventDefault();
        return false;
    }

    /* BACK / LEFT / 4 */
    if(k===8 || k===27 || k===461 ||
       k===37 || k===52 || k===100){

        backAction();
        e.preventDefault();
        return false;
    }

    /* 6 / RIGHT DISABLED */
    if(k===39 || k===54 || k===102){
        e.preventDefault();
        return false;
    }

    /* FAVOURITE - 5 */
    if(k===53 || k===101){
        if(page==="player") toggleFavorite();
        e.preventDefault();
        return false;
    }
};

/* =========================
   START APP
========================= */

openHome();

window.onerror=function(){
    return true;
};

</script>

</body>
  </html>
