<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUTIK FILE TEST</title>
<style>
body{
  margin:0;
  padding:8px;
  background:#101820;
  color:white;
  font-family:Arial;
  font-size:13px;
}
h3{color:#00e5ff;font-size:16px;}
button{
  width:100%;
  padding:10px 3px;
  margin:6px 0;
  background:#00bcd4;
  color:#000;
  border:0;
  font-weight:bold;
}
#result{
  background:#263238;
  padding:8px;
  margin-top:8px;
  overflow-wrap:anywhere;
  line-height:1.6;
}
input{width:100%;margin:10px 0;}
</style>
</head>
<body>

<h3>RUTIK FILE DIAGNOSTIC</h3>

<p>STEP 1: Select JAR File</p>

<input type="file" id="picker" accept=".jar,.jad">

<button onclick="checkFile()">CHECK FILE</button>

<div id="result">Waiting for file...</div>

<script>
var selectedFile = null;

var picker = document.getElementById("picker");
var result = document.getElementById("result");

picker.addEventListener("change", function(){

  selectedFile = null;

  if(!picker.files || picker.files.length === 0){
    result.innerHTML = "ERROR: No file received!";
    return;
  }

  selectedFile = picker.files[0];

  result.innerHTML =
    "FILE RECEIVED!<br>" +
    "Name: " + selectedFile.name + "<br>" +
    "Size: " + selectedFile.size + " bytes<br>" +
    "Type: " + selectedFile.type;
});

function checkFile(){

  if(!selectedFile){
    result.innerHTML += "<br>ERROR: JavaScript cannot access file.";
    return;
  }

  result.innerHTML += "<br>Reading file...";

  var reader = new FileReader();

  reader.onload = function(e){

    var data = new Uint8Array(e.target.result);

    var hex = "";

    for(var i=0; i<Math.min(data.length,8); i++){
      hex += data[i].toString(16).padStart(2,"0") + " ";
    }

    result.innerHTML +=
      "<br>FileReader: SUCCESS" +
      "<br>Bytes Read: " + data.length +
      "<br>First Bytes: " + hex;
  };

  reader.onerror = function(){
    result.innerHTML += "<br>FileReader: FAILED";
  };

  reader.readAsArrayBuffer(selectedFile);
}
</script>

</body>
</html>
