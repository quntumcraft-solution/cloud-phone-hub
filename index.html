<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAR Scanner 8.6</title>

<style>
body {
    background: #101820;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 8px;
}
h3 {
    color: #00e5ff;
    text-align: center;
}
button, input {
    width: 100%;
    padding: 9px;
    margin: 6px 0;
    box-sizing: border-box;
}
button {
    background: #00a8cc;
    color: white;
    border: 0;
}
#result {
    background: #202c36;
    padding: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
}
.ok { color: #00ff90; }
.err { color: #ff5555; }
</style>
</head>

<body>

<h3>JAR ZIP DIRECTORY SCANNER</h3>

<p>Select your JAR file:</p>
<input type="file" id="fileInput" accept=".jar,.zip">

<button id="scanBtn">SCAN JAR FILE</button>

<div id="result">STATUS: WAITING</div>

<script>

var result = document.getElementById("result");

function showError(name, message, step) {
    result.innerHTML =
        "STATUS: ERROR\n" +
        "STEP: " + step + "\n" +
        "ERROR NAME: " + name + "\n" +
        "ERROR MESSAGE: " + message;
}

window.onerror = function(message, source, line, column, error) {
    showError(
        error && error.name ? error.name : "JavaScript Error",
        message + "\nLine: " + line + "\nColumn: " + column,
        "GLOBAL ERROR"
    );
    return true;
};

document.getElementById("scanBtn").onclick = function() {

    var step = "START";

    try {

        var input = document.getElementById("fileInput");

        if (!input.files || input.files.length === 0) {
            result.innerHTML = "ERROR: Please select a JAR file.";
            return;
        }

        var file = input.files[0];

        result.innerHTML =
            "STATUS: READING FILE\n" +
            "FILE: " + file.name + "\n" +
            "SIZE: " + file.size + " bytes";

        step = "FILE READER";

        var reader = new FileReader();

        reader.onerror = function() {
            showError(
                "FileReaderError",
                "Unable to read selected file.",
                "FILE READER"
            );
        };

        reader.onload = function(event) {

            try {

                step = "CONVERT DATA";

                var buffer = event.target.result;
                var bytes = new Uint8Array(buffer);

                var view = new DataView(
                    bytes.buffer,
                    bytes.byteOffset,
                    bytes.byteLength
                );

                var length = bytes.length;

                if (length < 22) {
                    throw new Error("File is too small to be a ZIP/JAR.");
                }

                step = "FIND ZIP END RECORD";

                var eocd = -1;
                var start = length - 22;
                var minimum = length - 65557;

                if (minimum < 0) {
                    minimum = 0;
                }

                var i;

                for (i = start; i >= minimum; i--) {

                    if (
                        view.getUint32(i, true) === 0x06054b50
                    ) {
                        eocd = i;
                        break;
                    }
                }

                if (eocd < 0) {
                    throw new Error("ZIP End Record not found.");
                }

                step = "READ ZIP DIRECTORY";

                var entries = view.getUint16(eocd + 10, true);
                var directorySize = view.getUint32(eocd + 12, true);
                var directoryOffset = view.getUint32(eocd + 16, true);

                if (directoryOffset + directorySize > length) {
                    throw new Error("ZIP directory is outside file boundary.");
                }

                var pos = directoryOffset;
                var classCount = 0;
                var manifestFound = false;
                var metaInfFound = false;
                var totalUncompressed = 0;
                var fileList = "";
                var parsed = 0;

                step = "SCAN DIRECTORY ENTRIES";

                for (i = 0; i < entries; i++) {

                    if (pos + 46 > length) {
                        throw new Error("Directory entry exceeds file boundary.");
                    }

                    var signature = view.getUint32(pos, true);

                    if (signature !== 0x02014b50) {
                        throw new Error(
                            "Invalid central directory signature at entry " + i
                        );
                    }

                    var compressedSize = view.getUint32(pos + 20, true);
                    var uncompressedSize = view.getUint32(pos + 24, true);

                    var nameLength = view.getUint16(pos + 28, true);
                    var extraLength = view.getUint16(pos + 30, true);
                    var commentLength = view.getUint16(pos + 32, true);

                    var nextPos =
                        pos + 46 + nameLength + extraLength + commentLength;

                    if (nextPos > length) {
                        throw new Error("Invalid filename or directory length.");
                    }

                    var filename = "";

                    for (var j = 0; j < nameLength; j++) {
                        filename += String.fromCharCode(bytes[pos + 46 + j]);
                    }

                    filename = filename.replace(/\\/g, "/");

                    if (filename.toLowerCase().indexOf(".class") === filename.length - 6) {
                        classCount++;
                    }

                    if (filename.toUpperCase() === "META-INF/MANIFEST.MF") {
                        manifestFound = true;
                    }

                    if (filename.toUpperCase().indexOf("META-INF/") === 0) {
                        metaInfFound = true;
                    }

                    totalUncompressed += uncompressedSize;

                    if (parsed < 35) {
                        fileList += filename + "\n";
                    }

                    parsed++;
                    pos = nextPos;
                }

                step = "DISPLAY RESULTS";

                result.innerHTML =
                    '<span class="ok">STATUS: SCAN COMPLETED</span>\n\n' +
                    "FILE: " + file.name + "\n" +
                    "ORIGINAL SIZE: " + length + " bytes\n\n" +

                    "ZIP ENTRIES: " + entries + "\n" +
                    "PARSED ENTRIES: " + parsed + "\n" +
                    "CLASS FILES: " + classCount + "\n" +
                    "MANIFEST: " + (manifestFound ? "FOUND" : "NOT FOUND") + "\n" +
                    "META-INF: " + (metaInfFound ? "FOUND" : "NOT FOUND") + "\n" +
                    "TOTAL UNCOMPRESSED SIZE: " + totalUncompressed + " bytes\n\n" +

                    "FILE LIST:\n" + fileList + "\n" +
                    "ERROR: NONE";

            } catch (e) {

                showError(
                    e.name || "Error",
                    e.message || String(e),
                    step
                );

            }
        };

        reader.readAsArrayBuffer(file);

    } catch (e) {

        showError(
            e.name || "Error",
            e.message || String(e),
            step
        );

    }

};

</script>

</body>
 </html>
