<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK JAR ANALYZER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:6px;background:#101820;
 color:white;font-family:Arial;font-size:12px;
}
.header{
 background:#073b4c;border:1px solid #00e5ff;
 text-align:center;padding:9px 2px;
}
h2{color:#00e5ff;font-size:16px;margin:0}
.box{
 background:#263238;padding:8px;
 margin-top:8px;border:1px solid #455a64;
}
input{width:100%;margin:10px 0;color:white}
button{
 width:100%;padding:12px;margin:6px 0;
 background:#00bcd4;border:0;
 font-weight:bold;font-size:13px;
}
#status{
 background:#17252d;border:1px solid #00bcd4;
 padding:8px;margin-top:8px;
 line-height:1.6;overflow-wrap:anywhere;
}
.green{color:#00ff90}
.red{color:#ff5252}
.yellow{color:#ffeb3b}
</style>
</head>

<body>

<div class="header">
<h2>RUTIK JAR ANALYZER</h2>
VERSION 1.4
</div>

<div class="box">
<b>SELECT JAR FILE</b>
<input type="file" id="file" accept=".jar">
<div id="info">No file selected.</div>
</div>

<div class="box">
<button onclick="analyze()">ANALYZE JAR</button>
<button onclick="resetApp()">RESET</button>
<div id="status">Waiting for JAR file...</div>
</div>

<script>

var picker=document.getElementById("file");
var info=document.getElementById("info");
var statusBox=document.getElementById("status");
var selectedFile=null;

picker.onchange=function(){

 selectedFile=null;

 if(!picker.files || !picker.files.length){
  info.innerHTML="No file selected.";
  return;
 }

 selectedFile=picker.files[0];

 info.innerHTML=
 "<span class='green'>FILE SELECTED</span><br>"+
 selectedFile.name+"<br>"+
 selectedFile.size+" bytes";

 statusBox.innerHTML="Ready to analyze.";
};

function readPart(file,start,end,callback){

 try{
  var reader=new FileReader();

  reader.onload=function(){
   callback(null,new Uint8Array(reader.result));
  };

  reader.onerror=function(){
   callback("File read error",null);
  };

  reader.readAsArrayBuffer(file.slice(start,end));

 }catch(e){
  callback(e.message,null);
 }
}

function u16(b,p){
 return b[p]+b[p+1]*256;
}

function u32(b,p){
 return b[p]+b[p+1]*256+
 b[p+2]*65536+b[p+3]*16777216;
}

function readText(bytes){
 var s="";
 for(var i=0;i<bytes.length;i++){
  s+=String.fromCharCode(bytes[i]);
 }
 return s;
}

function showError(message){
 statusBox.innerHTML=
 "<span class='red'>ERROR</span><br>"+message;
}

function analyze(){

 if(!selectedFile){
  showError("Select a JAR file first.");
  return;
 }

 var size=selectedFile.size;

 if(size<22){
  showError("File is too small.");
  return;
 }

 statusBox.innerHTML=
 "<span class='yellow'>SEARCHING ZIP DIRECTORY...</span>";

 findEOCD(size);

}

function findEOCD(size){

 var end=size;
 var chunkSize=512;

 function scan(){

  var start=Math.max(0,end-chunkSize);

  readPart(selectedFile,start,end,function(err,b){

   if(err){
    showError(err);
    return;
   }

   for(var i=b.length-4;i>=0;i--){

    if(
     b[i]===0x50 &&
     b[i+1]===0x4b &&
     b[i+2]===0x05 &&
     b[i+3]===0x06
    ){

     var entries=u16(b,i+10);
     var cdSize=u32(b,i+12);
     var cdOffset=u32(b,i+16);

     if(entries===65535 ||
        cdSize===4294967295 ||
        cdOffset===4294967295){

      showError("ZIP64 archives are not supported in this version.");
      return;
     }

     statusBox.innerHTML=
     "<span class='green'>ZIP DIRECTORY FOUND</span><br>"+
     "Entries: "+entries+"<br>"+
     "Directory size: "+cdSize+" bytes<br>"+
     "Searching files...";

     readDirectory(cdOffset,entries,0);
     return;
    }
   }

   if(start===0){
    showError("ZIP End Directory not found.");
    return;
   }

   end=start+3;
   scan();

  });
 }

 scan();
}

function readDirectory(offset,total,index){

 if(index>=total){
  statusBox.innerHTML+=
  "<br><span class='yellow'>MANIFEST.MF NOT FOUND</span>";
  return;
 }

 readPart(selectedFile,offset,offset+46,function(err,h){

  if(err){
   showError(err);
   return;
  }

  if(h.length<46 ||
     h[0]!==0x50 ||
     h[1]!==0x4b ||
     h[2]!==0x01 ||
     h[3]!==0x02){

   showError("Invalid ZIP directory entry.");
   return;
  }

  var method=u16(h,10);
  var compressed=u32(h,20);
  var original=u32(h,24);
  var nameLen=u16(h,28);
  var extraLen=u16(h,30);
  var commentLen=u16(h,32);
  var localOffset=u32(h,42);

  var nameStart=offset+46;
  var nextOffset=nameStart+nameLen+extraLen+commentLen;

  readPart(selectedFile,nameStart,nameStart+nameLen,function(e,n){

   if(e){
    showError(e);
    return;
   }

   var filename=readText(n);

   if(filename.toUpperCase()==="META-INF/MANIFEST.MF"){

    statusBox.innerHTML=
    "<span class='green'>MANIFEST FOUND!</span><br>"+
    "File: "+filename+"<br>"+
    "Compression: "+method+"<br>"+
    "Compressed size: "+compressed+"<br>"+
    "Original size: "+original+"<br>"+
    "Reading manifest...";

    readManifest(localOffset,method,compressed,original);
    return;
   }

   readDirectory(nextOffset,total,index+1);

  });

 });
}

function readManifest(localOffset,method,compressed,original){

 readPart(selectedFile,localOffset,localOffset+30,function(err,h){

  if(err){
   showError(err);
   return;
  }

  if(h.length<30 ||
     h[0]!==0x50 ||
     h[1]!==0x4b ||
     h[2]!==0x03 ||
     h[3]!==0x04){

   showError("Invalid local file header.");
   return;
  }

  var nameLen=u16(h,26);
  var extraLen=u16(h,28);

  var dataStart=localOffset+30+nameLen+extraLen;

  if(method!==0){

   statusBox.innerHTML=
   "<span class='yellow'>MANIFEST FOUND</span><br>"+
   "Compression method: "+method+"<br><br>"+
   "Manifest is compressed.<br>"+
   "Decompression is not available in this version.<br><br>"+
   "We can handle this in the next version.";

   return;
  }

  var amount=Math.min(compressed,8192);

  readPart(selectedFile,dataStart,dataStart+amount,function(e,data){

   if(e){
    showError(e);
    return;
   }

   var text=readText(data);

   statusBox.innerHTML=
   "<span class='green'>MANIFEST READ SUCCESS!</span><br><br>"+
   text.replace(/\r?\n/g,"<br>");

  });

 });
}

function resetApp(){

 selectedFile=null;
 picker.value="";
 info.innerHTML="No file selected.";
 statusBox.innerHTML="Waiting for JAR file...";

}

</script>

</body>
</html>
