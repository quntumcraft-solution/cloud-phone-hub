<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUTIK DEBUG TEST</title>
<style>
body{
 background:#101820;
 color:white;
 font-family:Arial;
 padding:10px;
 font-size:13px;
}
button{
 width:100%;
 padding:12px;
 margin-top:10px;
 background:#00a8c7;
 color:white;
 border:0;
 font-weight:bold;
}
.box{
 background:#263746;
 padding:10px;
 margin-top:10px;
 word-wrap:break-word;
}
</style>
</head>
<body>

<h3>RUTIK JAR DEBUG</h3>

<div class="box">
STEP 1 - SELECT FILE
<input type="file" id="file" accept=".jar,.jad">
</div>

<button id="test">TEST BUTTON</button>

<div class="box">
<b>DEBUG OUTPUT</b>
<p id="output">Waiting...</p>
</div>

<script>
var fileInput=document.getElementById("file");
var output=document.getElementById("output");
var button=document.getElementById("test");

fileInput.onchange=function(){
 if(fileInput.files && fileInput.files.length>0){
  var f=fileInput.files[0];
  output.innerHTML=
   "FILE SELECTED SUCCESSFULLY"+
   "<br>Name: "+f.name+
   "<br>Size: "+f.size+" bytes"+
   "<br>Type: "+f.type;
 }else{
  output.innerHTML="FILE NOT SELECTED";
 }
};

button.onclick=function(){
 output.innerHTML+="<br><br>BUTTON CLICK SUCCESSFUL";
};
</script>

</body>
</html>
