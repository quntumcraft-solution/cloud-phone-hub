<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUTIK JAR ANALYZER V1.7</title>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:7px;
 background:#101820;
 color:#fff;
 font-family:Arial,sans-serif;
 font-size:12px;
}
h2{
 text-align:center;
 color:#00e5ff;
 font-size:16px;
}
.box{
 background:#1c2b36;
 border:1px solid #395365;
 padding:8px;
 margin-bottom:8px;
 border-radius:5px;
}
button{
 width:100%;
 padding:10px;
 margin-top:6px;
 background:#00a8c7;
 color:white;
 border:0;
 font-weight:bold;
}
input{width:100%;font-size:11px}
pre{
 white-space:pre-wrap;
 word-break:break-all;
 color:#b8ffca;
 font-size:11px;
}
.good{color:#00ff99}
.bad{color:#ff7373}
.small{color:#b8c9d5;font-size:10px}
</style>
</head>

<body>

<h2>RUTIK JAR ANALYZER</h2>

<div class="box">
<b>STEP 1 - SELECT JAR FILE</b>
<input type="file" id="file" accept=".jar,.zip">
<button onclick="analyze()">ANALYZE JAR</button>
<div id="status" class="small">Waiting for file...</div>
</div>

<div class="box">
<b>STEP 2 - JAR INFORMATION</b>
<pre id="info">No information yet.</pre>
</div>

<div class="box">
<b>STEP 3 - JAVA CLASS FILES</b>
<pre id="classes">No class files found yet.</pre>
</div>

<div class="box">
<b>STEP 4 - MAIN MIDLET CHECK</b>
<pre id="main">Waiting...</pre>
</div>

<div class="box">
<b>STEP 5 - FINAL RESULT</b>
<pre id="result">Waiting...</pre>
</div>

<script>
var selectedFile=null;

function status(t){
 document.getElementById("status").innerHTML=t;
}

function readSlice(file,start,end){
 return new Promise(function(resolve,reject){
  var r=new FileReader();
  r.onload=function(){resolve(new Uint8Array(r.result));};
  r.onerror=function(){reject("File reading error");};
  r.readAsArrayBuffer(file.slice(start,end));
 });
}

function u16(a,p){
 return a[p] | (a[p+1]<<8);
}

function u32(a,p){
 return (a[p] | (a[p+1]<<8) |
 (a[p+2]<<16) | (a[p+3]<<24))>>>0;
}

function decode(a){
 return new TextDecoder("utf-8").decode(a);
}

function getManifestValue(text,key){
 var lines=text.replace(/\r/g,"").split("\n");
 var output=[];
 var active=false;

 for(var i=0;i<lines.length;i++){
  var line=lines[i];

  if(line.charAt(0)===" " && output.length){
   output[output.length-1]+=line.substring(1);
   continue;
  }

  if(line.indexOf(key+":")===0){
   output.push(line.substring(key.length+1).trim());
   active=true;
  }else if(active){
   break;
  }
 }
 return output.length?output[0]:"Not Found";
}

async function analyze(){

 var file=document.getElementById("file").files[0];

 if(!file){
  alert("Please select JAR file");
  return;
 }

 document.getElementById("info").textContent="Reading...";
 document.getElementById("classes").textContent="Scanning...";
 document.getElementById("main").textContent="Checking...";
 document.getElementById("result").textContent="Processing...";

 try{

  if(typeof fflate==="undefined"){
   throw "FFLATE LIBRARY NOT LOADED";
  }

  status("Reading ZIP directory...");

  var tailSize=Math.min(file.size,65557);
  var tailStart=file.size-tailSize;
  var tail=await readSlice(file,tailStart,file.size);

  var eocd=-1;

  for(var i=tail.length-22;i>=0;i--){
   if(u32(tail,i)===0x06054b50){
    eocd=i;
    break;
   }
  }

  if(eocd<0) throw "ZIP END RECORD NOT FOUND";

  var total=u16(tail,eocd+10);
  var dirSize=u32(tail,eocd+12);
  var dirOffset=u32(tail,eocd+16);

  if(total===65535 || dirOffset===4294967295){
   throw "ZIP64 FORMAT NOT SUPPORTED";
  }

  if(dirOffset+dirSize>file.size){
   throw "INVALID ZIP DIRECTORY";
  }

  var directory=await readSlice(
   file,dirOffset,dirOffset+dirSize
  );

  var entries=[];
  var pos=0;
  var manifest=null;
  var classFiles=[];

  while(pos+46<=directory.length){

   if(u32(directory,pos)!==0x02014b50){
    break;
   }

   var flags=u16(directory,pos+8);
   var method=u16(directory,pos+10);
   var compSize=u32(directory,pos+20);
   var uncompSize=u32(directory,pos+24);
   var nameLen=u16(directory,pos+28);
   var extraLen=u16(directory,pos+30);
   var commentLen=u16(directory,pos+32);
   var localOffset=u32(directory,pos+42);

   var nameBytes=directory.slice(
    pos+46,pos+46+nameLen
   );

   var name=decode(nameBytes);

   var entry={
    name:name,
    flags:flags,
    method:method,
    compSize:compSize,
    uncompSize:uncompSize,
    localOffset:localOffset
   };

   entries.push(entry);

   if(name.toUpperCase()==="META-INF/MANIFEST.MF"){
    manifest=entry;
   }

   if(/\.class$/i.test(name)){
    classFiles.push(name);
   }

   pos+=46+nameLen+extraLen+commentLen;
  }

  document.getElementById("info").textContent=
   "File: "+file.name+
   "\nSize: "+file.size+" bytes"+
   "\nZIP Entries: "+entries.length+
   "\nClass Files: "+classFiles.length+
   "\nManifest: "+(manifest?"FOUND":"NOT FOUND");

  var manifestText="";

  if(manifest){

   status("Reading Manifest...");

   if(manifest.flags & 1){
    throw "ENCRYPTED MANIFEST";
   }

   var local=await readSlice(
    file,manifest.localOffset,manifest.localOffset+30
   );

   if(u32(local,0)!==0x04034b50){
    throw "INVALID LOCAL FILE HEADER";
   }

   var nameLength=u16(local,26);
   var extraLength=u16(local,28);

   var dataStart=
    manifest.localOffset+30+nameLength+extraLength;

   var compressed=await readSlice(
    file,dataStart,dataStart+manifest.compSize
   );

   var data;

   if(manifest.method===0){
    data=compressed;
   }else if(manifest.method===8){
    data=fflate.inflateSync(compressed);
   }else{
    throw "UNSUPPORTED COMPRESSION METHOD: "+manifest.method;
   }

   manifestText=decode(data);
  }

  var midletName=getManifestValue(manifestText,"MIDlet-Name");
  var midletVersion=getManifestValue(manifestText,"MIDlet-Version");
  var midletVendor=getManifestValue(manifestText,"MIDlet-Vendor");
  var midlet1=getManifestValue(manifestText,"MIDlet-1");

  var mainClass="Not Found";

  if(midlet1!=="Not Found"){
   var parts=midlet1.split(",");
   if(parts.length>=3){
    mainClass=parts[2].trim();
   }
  }

  var mainPath=mainClass.replace(/\./g,"/")+".class";
  var mainFound=classFiles.indexOf(mainPath)>=0;

  document.getElementById("info").textContent+=
   "\n\nMIDlet Name: "+midletName+
   "\nVersion: "+midletVersion+
   "\nVendor: "+midletVendor+
   "\nMIDlet-1: "+midlet1;

  var classOutput="TOTAL CLASS FILES: "+classFiles.length+"\n\n";

  for(var j=0;j<classFiles.length;j++){
   classOutput+=(j+1)+". "+classFiles[j]+"\n";
   if(j>=99){
    classOutput+="\n...More files not displayed.";
    break;
   }
  }

  document.getElementById("classes").textContent=classOutput;

  document.getElementById("main").textContent=
   "Main Class: "+mainClass+
   "\nClass Path: "+mainPath+
   "\nClass Found: "+(mainFound?"YES":"NO");

  var finalText="JAR ANALYSIS COMPLETED\n\n";

  finalText+="Manifest: "+(manifest?"PASS":"FAIL")+"\n";
  finalText+="Class Files: "+classFiles.length+"\n";
  finalText+="MIDlet Name: "+midletName+"\n";
  finalText+="Main Class: "+mainClass+"\n";
  finalText+="Main Class Present: "+(mainFound?"YES":"NO")+"\n\n";

  if(manifest && classFiles.length>0 && mainFound){
   finalText+="POTENTIAL JAVA ME MIDLET FOUND";
  }else{
   finalText+="INCOMPLETE OR INVALID MIDLET STRUCTURE";
  }

  finalText+="\n\nNOTE: This tool analyzes JAR files.";
  finalText+="\nIt does not install or execute Java apps.";

  document.getElementById("result").textContent=finalText;

  status("ANALYSIS SUCCESSFUL");

 }catch(e){

  status("ERROR: "+e);

  document.getElementById("result").textContent=
   "ANALYSIS FAILED\n\n"+e;
 }
}
</script>

</body>
 </html>
