<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK TEST 8.5</title>

<style>
body{
 background:#111;
 color:#00ff00;
 font:12px Arial;
 padding:8px;
}
.box{
 border:1px solid #00ff00;
 padding:8px;
 margin:8px 0;
 word-wrap:break-word;
}
button{
 width:100%;
 padding:12px;
 margin:6px 0;
}
</style>
</head>

<body>

<h3>RUTIK FULL JAR READER</h3>

<div class="box" id="status">STATUS: PAGE LOADED</div>

<input type="file" id="file" accept=".jar,.zip">

<button id="start">START FULL FILE TEST</button>

<div class="box" id="result">RESULT: WAITING</div>

<div class="box" id="progress">PROGRESS: 0%</div>

<div class="box" id="error">ERROR: NONE</div>

<script>

var statusBox=document.getElementById("status");
var resultBox=document.getElementById("result");
var progressBox=document.getElementById("progress");
var errorBox=document.getElementById("error");
var fileInput=document.getElementById("file");

var chunkSize=65536;
var offset=0;
var totalRead=0;
var totalSize=0;
var reader=null;
var selectedFile=null;

function showError(step,e){

 statusBox.innerHTML="STATUS: FAILED";

 errorBox.innerHTML=
 "ERROR STEP: "+step+
 "<br>ERROR NAME: "+(e.name||"Unknown")+
 "<br>ERROR MESSAGE: "+(e.message||e);
}

window.onerror=function(msg,url,line,col){

 errorBox.innerHTML=
 "JAVASCRIPT ERROR: "+msg+
 "<br>LINE: "+line+
 "<br>COLUMN: "+col;

 statusBox.innerHTML="STATUS: JAVASCRIPT ERROR";
 return false;
};

fileInput.onchange=function(){

 try{

 selectedFile=fileInput.files[0];

 if(selectedFile){

 statusBox.innerHTML="STATUS: FILE SELECTED";

 resultBox.innerHTML=
 "FILE: "+selectedFile.name+
 "<br>SIZE: "+selectedFile.size+" Bytes";

 }else{

 statusBox.innerHTML="STATUS: NO FILE";
 }

 }catch(e){

 showError("FILE SELECTION",e);

 }

};

function readNextChunk(){

 try{

 if(offset>=totalSize){

 statusBox.innerHTML="TEST COMPLETED";

 resultBox.innerHTML=
 "FILE: "+selectedFile.name+
 "<br>ORIGINAL SIZE: "+totalSize+
 "<br>READ BYTES: "+totalRead+
 "<br>CHUNK SIZE: "+chunkSize+
 "<br>RESULT: FULL FILE READ SUCCESSFUL";

 progressBox.innerHTML="PROGRESS: 100%";

 return;
 }

 var end=offset+chunkSize;

 if(end>totalSize){
 end=totalSize;
 }

 var part=selectedFile.slice(offset,end);

 reader=new FileReader();

 reader.onload=function(){

 try{

 if(!reader.result){
 throw new Error("EMPTY CHUNK DATA");
 }

 var bytes=reader.result.byteLength;

 totalRead=totalRead+bytes;
 offset=end;

 var percent=Math.floor(
 (totalRead/totalSize)*100
 );

 progressBox.innerHTML=
 "PROGRESS: "+percent+"%"+
 "<br>READ: "+totalRead+
 "<br>TOTAL: "+totalSize;

 statusBox.innerHTML=
 "READING CHUNK: "+totalRead+" BYTES";

 resultBox.innerHTML=
 "FILE: "+selectedFile.name+
 "<br>CHUNK READ: "+bytes+
 "<br>TOTAL READ: "+totalRead;

 readNextChunk();

 }catch(e){

 showError("CHUNK PROCESSING",e);

 }

 };

 reader.onerror=function(){

 showError(
 "FILE READING",
 reader.error||"UNKNOWN FILEREADER ERROR"
 );

 };

 reader.onabort=function(){

 statusBox.innerHTML="STATUS: ABORTED";

 errorBox.innerHTML="ERROR: READING ABORTED";

 };

 reader.readAsArrayBuffer(part);

 }catch(e){

 showError("READ NEXT CHUNK",e);

 }

}

document.getElementById("start").onclick=function(){

 try{

 errorBox.innerHTML="ERROR: NONE";

 if(!selectedFile){

 throw new Error("PLEASE SELECT A JAR FILE");
 }

 if(typeof FileReader!=="function"){

 throw new Error("FILEREADER NOT SUPPORTED");
 }

 totalSize=selectedFile.size;

 if(totalSize<=0){

 throw new Error("EMPTY FILE");
 }

 offset=0;
 totalRead=0;

 statusBox.innerHTML="TEST STARTED";

 resultBox.innerHTML="PREPARING FILE READING...";

 progressBox.innerHTML="PROGRESS: 0%";

 readNextChunk();

 }catch(e){

 showError("START TEST",e);

 }

};

</script>

</body>
</html>
