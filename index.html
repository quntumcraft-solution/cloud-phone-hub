<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUTIK TEST 8.2</title>
<style>
body{background:#111;color:#0f0;font:12px Arial;padding:8px}
.box{border:1px solid #0f0;padding:8px;margin:7px 0;word-wrap:break-word}
button{padding:10px;width:100%;margin:5px 0}
</style>
</head>
<body>

<h3>RUTIK COMPATIBILITY TEST</h3>

<div class="box" id="status">STARTING...</div>
<div class="box" id="result">WAITING...</div>
<div class="box" id="error">ERROR: NONE</div>

<button id="run">RUN ALL TESTS</button>

<script>
var result=document.getElementById("result");
var error=document.getElementById("error");
var status=document.getElementById("status");

function log(msg){
 result.innerHTML+= "<br>"+msg;
}

function showError(name,msg){
 error.innerHTML+="<br>"+name+": "+msg;
}

window.onerror=function(message,source,line,column){
 showError("JAVASCRIPT ERROR",message+
 "<br>Line: "+line+" Column: "+column);
 return false;
};

status.innerHTML="JAVASCRIPT STARTED";

document.getElementById("run").onclick=function(){

 result.innerHTML="TEST STARTED";
 error.innerHTML="ERROR: NONE";

 try{
 if(typeof Promise==="function"){
 log("PASS: PROMISE SUPPORTED");
 }else{
 log("FAIL: PROMISE NOT SUPPORTED");
 }
 }catch(e){showError(e.name,e.message);}

 try{
 if(typeof FileReader==="function"){
 log("PASS: FILEREADER SUPPORTED");
 }else{
 log("FAIL: FILEREADER NOT SUPPORTED");
 }
 }catch(e){showError(e.name,e.message);}

 try{
 if(typeof TextDecoder==="function"){
 log("PASS: TEXTDECODER SUPPORTED");
 }else{
 log("FAIL: TEXTDECODER NOT SUPPORTED");
 }
 }catch(e){showError(e.name,e.message);}

 try{
 if(typeof DecompressionStream==="function"){
 log("PASS: DECOMPRESSIONSTREAM SUPPORTED");
 }else{
 log("FAIL: DECOMPRESSIONSTREAM NOT SUPPORTED");
 }
 }catch(e){showError(e.name,e.message);}

 try{
 var a=async function(){return "OK";};
 log("PASS: ASYNC FUNCTION SUPPORTED");
 }catch(e){showError(e.name,e.message);}

 status.innerHTML="ALL TESTS COMPLETED";
};

</script>
</body>
</html>
