<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK JAR TEST</title>
<style>
body{
 background:#101820;
 color:white;
 font-family:Arial;
 padding:10px;
 font-size:13px;
}
.box{
 background:#263746;
 padding:10px;
 margin-bottom:10px;
}
button{
 width:100%;
 padding:12px;
 background:#00a8c7;
 color:white;
 border:0;
 font-weight:bold;
 margin-top:10px;
}
input{width:100%;margin-top:10px}
pre{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>

<h3>RUTIK JAR ANALYZER V1.7.2</h3>

<div class="box">
<b>SELECT JAR FILE</b>
<input type="file" id="jarFile" accept=".jar,.jad,.zip">
</div>

<div class="box">
<button onclick="checkFile()">CHECK SELECTED FILE</button>
</div>

<div class="box">
<b>DEBUG RESULT</b>
<pre id="output">Waiting for file...</pre>
</div>

<script>

function checkFile(){

 var input=document.getElementById("jarFile");
 var output=document.getElementById("output");

 output.innerHTML="BUTTON CLICK SUCCESSFUL";

 try{

  if(!input.files){
   output.innerHTML+="\nERROR: FILE API NOT AVAILABLE";
   return;
  }

  output.innerHTML+="\nFILE API AVAILABLE";

  output.innerHTML+="\nFILES COUNT: "+input.files.length;

  if(input.files.length===0){
   output.innerHTML+="\nNO FILE SELECTED";
   return;
  }

  var f=input.files[0];

  output.innerHTML+=
   "\n\nFILE NAME: "+f.name+
   "\nFILE SIZE: "+f.size+
   "\nFILE TYPE: "+f.type+
   "\n\nFILE OBJECT SUCCESSFUL";

 }catch(e){

  output.innerHTML+="\nERROR: "+e.message;

 }

}

</script>

</body>
</html>
