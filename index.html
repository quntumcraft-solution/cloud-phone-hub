<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RUTIK YOUTUBE REMOTE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #070b14;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  font-size: 10px;
}

header {
  height: 18px;
  padding: 4px 2px;
  text-align: center;
  color: #44e0c0;
  background: #101a2b;
  font-size: 9px;
  font-weight: bold;
}

.video-box {
  width: 100%;
  height: 80px;
  margin-top: 3px;
  background: black;
  border: 1px solid #354b66;
  overflow: hidden;
}

#player {
  width: 200px;
  height: 200px;
  transform: scale(0.6);
  transform-origin: top left;
}

.url-box {
  display: flex;
  gap: 3px;
  height: 23px;
  margin: 4px 3px;
}

#videoUrl {
  min-width: 0;
  flex: 1;
  padding: 3px;
  background: #14243a;
  border: 1px solid #354b66;
  color: white;
  font-size: 8px;
}

button {
  color: white;
  background: #18283d;
  border: 1px solid #354b66;
  border-radius: 3px;
  font-size: 8px;
}

button:focus, input:focus {
  outline: 2px solid #43ddc0;
}

#load {
  width: 28px;
  background: #087d70;
}

.controls {
  display: flex;
  gap: 2px;
  padding: 2px;
}

.controls button {
  flex: 1;
  height: 32px;
  padding: 2px 0;
}

#play {
  background: #087d70;
}

.info {
  margin: 5px 3px;
  padding: 4px;
  background: #14243a;
  text-align: center;
}

#time {
  font-size: 9px;
  color: #44e0c0;
}

#status {
  margin-top: 3px;
  font-size: 7px;
  color: #a9bbd0;
}

footer {
  position: absolute;
  bottom: 2px;
  width: 100%;
  text-align: center;
  color: #8298b2;
  font-size: 6px;
}
</style>
</head>

<body>

<header>RUTIK YOUTUBE REMOTE</header>

<div class="video-box">
  <div id="player"></div>
</div>

<div class="url-box">
  <input id="videoUrl" type="text" placeholder="YouTube Video URL">
  <button id="load" type="button">GO</button>
</div>

<div class="controls">
  <button id="back30" type="button">2<br>-30s</button>
  <button id="back10" type="button">4<br>-10s</button>
  <button id="play" type="button">5<br>PLAY</button>
  <button id="forward10" type="button">6<br>+10s</button>
  <button id="forward30" type="button">8<br>+30s</button>
</div>

<div class="info">
  <div id="time">00:00 / 00:00</div>
  <div id="status">Loading YouTube Player...</div>
</div>

<footer>2 4 5 6 8 KEYPAD CONTROL</footer>

<script>
var player = null;
var ready = false;
var timer = null;

function status(text) {
  document.getElementById("status").textContent = text;
}

function getVideoId(url) {
  url = url.trim();

  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {
    return url;
  }

  try {
    var u = new URL(url);

    if (u.hostname.indexOf("youtu.be") !== -1) {
      return u.pathname.split("/")[1];
    }

    if (u.searchParams.get("v")) {
      return u.searchParams.get("v");
    }

    var parts = u.pathname.split("/");
    var i = parts.findIndex(function(x) {
      return ["embed", "shorts", "live"].indexOf(x) !== -1;
    });

    if (i >= 0) return parts[i + 1];

  } catch(e) {}

  return null;
}

function onYouTubeIframeAPIReady() {

  player = new YT.Player("player", {
    width: "200",
    height: "200",

    playerVars: {
      playsinline: 1,
      controls: 1,
      rel: 0
    },

    events: {

      onReady: function() {
        ready = true;
        status("Player Ready");

        timer = setInterval(updateTime, 1000);
      },

      onStateChange: function(event) {

        if (event.data === 1) {
          document.getElementById("play").innerHTML = "5<br>PAUSE";
          status("Playing");
        }

        if (event.data === 2) {
          document.getElementById("play").innerHTML = "5<br>PLAY";
          status("Paused");
        }

        if (event.data === 0) {
          document.getElementById("play").innerHTML = "5<br>PLAY";
          status("Video Ended");
        }
      },

      onError: function(event) {
        status("YouTube Error: " + event.data);
      }
    }
  });
}

function loadVideo() {

  if (!ready) {
    status("Player Loading...");
    return;
  }

  var id = getVideoId(
    document.getElementById("videoUrl").value
  );

  if (!id) {
    status("Invalid Video URL");
    return;
  }

  player.loadVideoById(id);
  status("Loading Video...");
}

function seek(seconds) {

  if (!ready) return;

  try {
    var current = player.getCurrentTime();
    var duration = player.getDuration();

    var target = Math.max(
      0,
      Math.min(duration, current + seconds)
    );

    player.seekTo(target, true);

  } catch(e) {
    status("Seek Failed");
  }
}

function togglePlay() {

  if (!ready) return;

  var state = player.getPlayerState();

  if (state === 1) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function updateTime() {

  if (!ready) return;

  try {
    var current = player.getCurrentTime();
    var duration = player.getDuration();

    function fmt(t) {
      t = Math.floor(t || 0);

      return String(Math.floor(t / 60)).padStart(2, "0")
        + ":" +
        String(t % 60).padStart(2, "0");
    }

    document.getElementById("time").textContent =
      fmt(current) + " / " + fmt(duration);

  } catch(e) {}
}

document.getElementById("load").onclick = loadVideo;

document.getElementById("back30").onclick = function() {
  seek(-30);
};

document.getElementById("back10").onclick = function() {
  seek(-10);
};

document.getElementById("play").onclick = togglePlay;

document.getElementById("forward10").onclick = function() {
  seek(10);
};

document.getElementById("forward30").onclick = function() {
  seek(30);
};

document.addEventListener("keydown", function(e) {

  var input = document.getElementById("videoUrl");

  if (document.activeElement === input) return;

  switch(e.key) {

    case "2":
      e.preventDefault();
      seek(-30);
      break;

    case "4":
      e.preventDefault();
      seek(-10);
      break;

    case "5":
      e.preventDefault();
      togglePlay();
      break;

    case "6":
      e.preventDefault();
      seek(10);
      break;

    case "8":
      e.preventDefault();
      seek(30);
      break;
  }
});
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
