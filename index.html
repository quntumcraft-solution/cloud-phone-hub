<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK JAVA ANALYZER V1.6</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:6px;background:#101820;
 color:white;font-family:Arial;font-size:12px;
}
.header{
 background:#073b4c;border:1px solid #00e5ff;
 text-align:center;padding:9px 2px;
}
h2{color:#00e5ff;font-size:16px;margin:0}
.box{
 background:#263238;padding:8px;
 margin-top:8px;border:1px solid #455a64;
}
input{width:100%;margin:10px 0;color:white}
button{
 width:100%;padding:12px;margin:6px 0;
 background:#00bcd4;border:0;
 font-weight:bold;font-size:13px;
}
#status{
 background:#17252d;border:1px solid #00bcd4;
 padding:8px;margin-top:8px;
 line-height:1.6;overflow-wrap:anywhere;
}
.green{color:#00ff90}
.red{color:#ff5252}
.yellow{color:#ffeb3b}
</style>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

</head>

<body>

<div class="header">
<h2>RUTIK JAVA ANALYZER</h2>
VERSION 1.6
</div>

<div class="box">
<b>SELECT JAVA APPLICATION</b>
<input type="file" id="file" accept=".jar,.jad">
<div id="info">No file selected.</div>
</div>

<div class="box">

<button onclick="checkLibrary()">CHECK LIBRARY</button>

<button onclick="analyze()">READ MANIFEST</button>

<button onclick="resetApp()">RESET</button>

<div id="status">
Checking system...
</div>

</div>

<script>

var picker=document.getElementById("file");
var info=document.getElementById("info");
var statusBox=document.getElementById("status");

var selectedFile=null;

picker.onchange=function(){

 selectedFile=null;

 if(!picker.files || !picker.files.length){
  info.innerHTML="No file selected.";
  return;
 }

 selectedFile=picker.files[0];

 info.innerHTML=
 "<span class='green'>FILE SELECTED</span><br>"+
 selectedFile.name+"<br>"+
 selectedFile.size+" bytes";

 statusBox.innerHTML="File ready.";
};

function checkLibrary(){

 if(typeof fflate==="undefined"){

  statusBox.innerHTML=
  "<span class='red'>FFLATE NOT LOADED</span><br>"+
  "Internet or CDN access failed.";

  return;
 }

 if(typeof fflate.inflateSync!=="function"){

  statusBox.innerHTML=
  "<span class='red'>INFLATE FUNCTION NOT FOUND</span>";

  return;
 }

 statusBox.innerHTML=
 "<span class='green'>FFLATE LIBRARY READY!</span><br>"+
 "Version: 0.8.2<br>"+
 "DEFLATE function available.";
}

function readPart(file,start,end,callback){

 try{

  var reader=new FileReader();

  reader.onload=function(){
   callback(null,new Uint8Array(reader.result));
  };

  reader.onerror=function(){
   callback("File read error",null);
  };

  reader.readAsArrayBuffer(file.slice(start,end));

 }catch(e){

  callback(e.message,null);

 }
}

function u16(b,p){
 return b[p]+b[p+1]*256;
}

function u32(b,p){
 return b[p]+b[p+1]*256+
 b[p+2]*65536+b[p+3]*16777216;
}

function readText(bytes){

 var s="";

 for(var i=0;i<bytes.length;i++){
  s+=String.fromCharCode(bytes[i]);
 }

 return s;
}

function showError(message){

 statusBox.innerHTML=
 "<span class='red'>ERROR</span><br>"+message;

}

function analyze(){

 if(!selectedFile){
  showError("Select JAR file first.");
  return;
 }

 if(typeof fflate==="undefined"){
  showError("FFLATE library not loaded. Check internet.");
  return;
 }

 statusBox.innerHTML=
 "<span class='yellow'>SEARCHING ZIP DIRECTORY...</span>";

 findEOCD(selectedFile.size);

}

function findEOCD(size){

 var end=size;

 function scan(){

  var start=Math.max(0,end-1024);

  readPart(selectedFile,start,end,function(err,b){

   if(err){
    showError(err);
    return;
   }

   for(var i=b.length-4;i>=0;i--){

    if(
     b[i]===0x50 &&
     b[i+1]===0x4b &&
     b[i+2]===0x05 &&
     b[i+3]===0x06
    ){

     var entries=u16(b,i+10);
     var offset=u32(b,i+16);

     if(entries===65535 || offset===4294967295){
      showError("ZIP64 format not supported.");
      return;
     }

     readDirectory(offset,entries,0);
     return;

    }

   }

   if(start===0){
    showError("ZIP End Directory not found.");
    return;
   }

   end=start+3;
   scan();

  });

 }

 scan();

}

function readDirectory(offset,total,index){

 if(index>=total){
  showError("MANIFEST.MF not found.");
  return;
 }

 readPart(selectedFile,offset,offset+46,function(err,h){

  if(err){
   showError(err);
   return;
  }

  if(h.length<46 ||
     h[0]!==0x50 ||
     h[1]!==0x4b ||
     h[2]!==0x01 ||
     h[3]!==0x02){

   showError("Invalid ZIP directory entry.");
   return;

  }

  var flags=u16(h,8);
  var method=u16(h,10);
  var compressed=u32(h,20);
  var original=u32(h,24);

  var nameLen=u16(h,28);
  var extraLen=u16(h,30);
  var commentLen=u16(h,32);

  var localOffset=u32(h,42);

  var nameStart=offset+46;
  var next=nameStart+nameLen+extraLen+commentLen;

  readPart(selectedFile,nameStart,nameStart+nameLen,function(e,n){

   if(e){
    showError(e);
    return;
   }

   var filename=readText(n);

   if(filename.toUpperCase()==="META-INF/MANIFEST.MF"){

    if(flags & 1){
     showError("Manifest is encrypted.");
     return;
    }

    readManifest(
     localOffset,
     method,
     compressed,
     original
    );

    return;

   }

   readDirectory(next,total,index+1);

  });

 });

}

function readManifest(localOffset,method,compressed,original){

 if(method!==8 && method!==0){

  showError("Unsupported compression method: "+method);
  return;

 }

 readPart(selectedFile,localOffset,localOffset+30,function(err,h){

  if(err){
   showError(err);
   return;
  }

  if(h.length<30 ||
     h[0]!==0x50 ||
     h[1]!==0x4b ||
     h[2]!==0x03 ||
     h[3]!==0x04){

   showError("Invalid local ZIP header.");
   return;

  }

  var nameLen=u16(h,26);
  var extraLen=u16(h,28);

  var dataStart=localOffset+30+nameLen+extraLen;

  statusBox.innerHTML=
  "<span class='yellow'>READING MANIFEST...</span>";

  readPart(
   selectedFile,
   dataStart,
   dataStart+compressed,
   function(e,data){

    if(e){
     showError(e);
     return;
    }

    try{

     var output;

     if(method===8){

      output=fflate.inflateSync(data);

     }else{

      output=data;

     }

     if(output.length!==original){

      statusBox.innerHTML=
      "<span class='yellow'>WARNING</span><br>"+
      "Expected: "+original+" bytes<br>"+
      "Read: "+output.length+" bytes<br><br>";

     }

     showManifest(readText(output));

    }catch(error){

     showError(
      "DEFLATE ERROR: "+
      (error.message || error)
     );

    }

   }
  );

 });

}

function showManifest(text){

 var result=
 "<span class='green'>MANIFEST DECOMPRESSED!</span><br><br>";

 var fields=[
  "MIDlet-Name",
  "MIDlet-Version",
  "MIDlet-Vendor",
  "MIDlet-1",
  "MIDlet-Jar-Size",
  "MIDlet-Jar-URL"
 ];

 for(var i=0;i<fields.length;i++){

  var key=fields[i];

  var regex=new RegExp(
   "^"+key+":\\s*(.*)$",
   "im"
  );

  var match=text.match(regex);

  if(match){

   result+=
   "<b>"+key+"</b><br>"+
   match[1]+"<br><br>";

  }

 }

 result+="<br>FULL MANIFEST:<br>"+
 text.replace(/\r?\n/g,"<br>");

 statusBox.innerHTML=result;

}

function resetApp(){

 selectedFile=null;
 picker.value="";

 info.innerHTML="No file selected.";

 statusBox.innerHTML="Waiting for JAR file...";

}

window.onload=function(){

 if(typeof fflate!=="undefined"){

  statusBox.innerHTML=
  "<span class='green'>FFLATE LOADED SUCCESSFULLY</span>";

 }else{

  statusBox.innerHTML=
  "<span class='red'>FFLATE NOT LOADED</span><br>"+
  "Internet or CDN access required.";

 }

};

</script>

</body>
 </html>
