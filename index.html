<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK JAR ANALYZER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:6px;background:#101820;
 color:white;font-family:Arial;font-size:12px;
}
.header{
 background:#073b4c;border:1px solid #00e5ff;
 text-align:center;padding:9px 2px;
}
h2{color:#00e5ff;font-size:16px;margin:0}
.box{
 background:#263238;padding:8px;
 margin-top:8px;border:1px solid #455a64;
}
input{width:100%;margin:10px 0;color:white}
button{
 width:100%;padding:12px;margin:6px 0;
 background:#00bcd4;border:0;
 font-weight:bold;font-size:13px;
}
#status{
 background:#17252d;border:1px solid #00bcd4;
 padding:8px;margin-top:8px;
 line-height:1.6;overflow-wrap:anywhere;
}
.green{color:#00ff90}
.red{color:#ff5252}
.yellow{color:#ffeb3b}
</style>
</head>
<body>

<div class="header">
<h2>RUTIK JAR ANALYZER</h2>
VERSION 1.3
</div>

<div class="box">
<b>SELECT JAR FILE</b>
<input type="file" id="file" accept=".jar,.jad">
<div id="info">No file selected.</div>
</div>

<div class="box">
<button onclick="analyze()">ANALYZE JAR</button>
<button onclick="resetApp()">RESET</button>
<div id="status">Waiting for JAR file...</div>
</div>

<script>
var picker=document.getElementById("file");
var info=document.getElementById("info");
var statusBox=document.getElementById("status");
var selectedFile=null;

picker.onchange=function(){
 selectedFile=null;

 if(!picker.files || !picker.files.length){
  info.innerHTML="No file selected.";
  return;
 }

 selectedFile=picker.files[0];

 info.innerHTML=
 "<span class='green'>FILE SELECTED</span><br>"+
 selectedFile.name+"<br>"+
 selectedFile.size+" bytes";

 statusBox.innerHTML="Ready to analyze.";
};

function readPart(file,start,end,callback){
 try{
  var reader=new FileReader();

  reader.onload=function(){
   callback(null,new Uint8Array(reader.result));
  };

  reader.onerror=function(){
   callback("File read error",null);
  };

  reader.readAsArrayBuffer(file.slice(start,end));

 }catch(e){
  callback(e.message,null);
 }
}

function hex(bytes){
 var s="";
 for(var i=0;i<bytes.length;i++){
  s+=("0"+bytes[i].toString(16)).slice(-2)+" ";
 }
 return s;
}

function analyze(){

 if(!selectedFile){
  statusBox.innerHTML="<span class='red'>Select a file first.</span>";
  return;
 }

 statusBox.innerHTML=
 "<span class='yellow'>READING JAR HEADER...</span>";

 var size=selectedFile.size;
 var amount=Math.min(size,64);

 readPart(selectedFile,0,amount,function(error,data){

  if(error){
   statusBox.innerHTML=
   "<span class='red'>ERROR: "+error+"</span>";
   return;
  }

  var signature="";
  for(var i=0;i<Math.min(4,data.length);i++){
   signature+=("0"+data[i].toString(16)).slice(-2)+" ";
  }

  var isZip=
   data.length>=4 &&
   data[0]===0x50 &&
   data[1]===0x4b &&
   data[2]===0x03 &&
   data[3]===0x04;

  var message=
   "FILE: "+selectedFile.name+"<br>"+
   "SIZE: "+size+" bytes<br><br>"+
   "FIRST 64 BYTES:<br>"+hex(data)+"<br><br>"+
   "SIGNATURE: "+signature+"<br>";

  if(isZip){
   message+=
   "<span class='green'>ZIP HEADER FOUND</span><br>"+
   "This file has a standard ZIP local header.";
  }else if(
   data.length>=4 &&
   data[0]===0x50 &&
   data[1]===0x4b
  ){
   message+=
   "<span class='yellow'>PK SIGNATURE FOUND</span><br>"+
   "ZIP marker found, but not the usual first header.";
  }else{
   message+=
   "<span class='red'>STANDARD JAR HEADER NOT FOUND</span><br>"+
   "The first bytes are not PK 03 04.";
  }

  statusBox.innerHTML=message;

  // Read the final 64 bytes as a second diagnostic.
  var start=Math.max(0,size-64);

  readPart(selectedFile,start,size,function(err,last){

   if(err){
    statusBox.innerHTML+="<br>End check failed.";
    return;
   }

   var endHex=hex(last);

   statusBox.innerHTML+=
   "<br><br>LAST 64 BYTES:<br>"+endHex;

   var found=false;

   for(var j=0;j<last.length-3;j++){
    if(last[j]===0x50 &&
       last[j+1]===0x4b &&
       last[j+2]===0x05 &&
       last[j+3]===0x06){
     found=true;
     break;
    }
   }

   statusBox.innerHTML+=found
    ? "<br><span class='green'>ZIP END MARKER FOUND</span>"
    : "<br><span class='yellow'>ZIP END MARKER NOT FOUND IN LAST 64 BYTES</span>";

  });

 });
}

function resetApp(){
 selectedFile=null;
 picker.value="";
 info.innerHTML="No file selected.";
 statusBox.innerHTML="Waiting for JAR file...";
}
</script>

</body>
</html>
