<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST 8.11</title>

<style>
body {
    background: #111;
    color: #00ff80;
    font-family: Arial;
    font-size: 12px;
    padding: 8px;
}
h3 {
    color: yellow;
    text-align: center;
}
.box {
    border: 1px solid #00ff80;
    padding: 7px;
    margin-bottom: 7px;
    word-wrap: break-word;
}
button {
    width: 100%;
    padding: 9px;
    background: #00aa55;
    color: white;
    border: 0;
}
#error {
    color: red;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h3>TEST 8.11</h3>
<div class="box" id="status">STATUS: STARTING...</div>
<div class="box" id="javascript">JavaScript: CHECKING</div>
<div class="box" id="java">Java Runtime: CHECKING</div>
<div class="box" id="plugin">Java Plugin: CHECKING</div>
<div class="box" id="fileapi">File API: CHECKING</div>
<div class="box" id="browser">Browser: CHECKING</div>
<div class="box" id="result">RESULT: WAITING</div>

<div class="box">
ERROR DETAILS:
<div id="error">NONE</div>
</div>

<button onclick="runTest()">RUN TEST AGAIN</button>

<script>

var currentStep = "INITIALIZATION";

window.onerror = function(msg, url, line, column) {
    document.getElementById("error").innerHTML =
        "STEP: " + currentStep +
        "\nERROR: " + msg +
        "\nLINE: " + line +
        "\nCOLUMN: " + column;

    document.getElementById("status").innerHTML =
        "STATUS: ERROR DETECTED";

    return true;
};

function setText(id, value) {
    document.getElementById(id).innerHTML = value;
}

function runTest() {
    try {
        currentStep = "JAVASCRIPT";
        setText("javascript", "JavaScript: WORKING");

        currentStep = "JAVA RUNTIME";

        var javaFound = false;

        if (typeof window.Java != "undefined") {
            javaFound = true;
        }

        if (navigator.javaEnabled) {
            try {
                if (navigator.javaEnabled()) {
                    javaFound = true;
                }
            } catch(e) {}
        }

        setText("java",
            "Java Runtime Indicator: " +
            (javaFound ? "FOUND" : "NOT DETECTED"));

        currentStep = "JAVA PLUGIN";

        var pluginFound = false;

        if (navigator.plugins) {
            for (var i = 0; i < navigator.plugins.length; i++) {
                var name = navigator.plugins[i].name;

                if (name.toLowerCase().indexOf("java") >= 0) {
                    pluginFound = true;
                }
            }
        }

        setText("plugin",
            "Java Plugin: " +
            (pluginFound ? "FOUND" : "NOT DETECTED"));

        currentStep = "FILE API";

        var fileSupport = false;

        if (window.File && window.FileReader &&
            window.FileList && window.Blob) {
            fileSupport = true;
        }

        setText("fileapi",
            "File API: " +
            (fileSupport ? "SUPPORTED" : "NOT SUPPORTED"));

        currentStep = "BROWSER";

        setText("browser",
            "User Agent:\n" + navigator.userAgent);

        currentStep = "FINAL RESULT";

        setText("result",
            "RESULT: TEST COMPLETED\n" +
            "Java Runtime: " +
            (javaFound ? "INDICATOR FOUND" : "NOT DETECTED") +
            "\nJava Plugin: " +
            (pluginFound ? "FOUND" : "NOT DETECTED") +
            "\nFile API: " +
            (fileSupport ? "SUPPORTED" : "NOT SUPPORTED") +
            "\n\nNOTE: Browser test cannot confirm native MIDlet support.");

        setText("status", "STATUS: TEST COMPLETED");
        setText("error", "NONE");

    } catch(e) {
        setText("status", "STATUS: TEST FAILED");
        setText("error",
            "STEP: " + currentStep +
            "\nERROR NAME: " + e.name +
            "\nERROR MESSAGE: " + e.message);
    }
}

runTest();

</script>
</body>
</html>
