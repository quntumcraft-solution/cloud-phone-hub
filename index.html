<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK DEBUG</title>
<style>
body{background:#101820;color:white;padding:10px;font:13px Arial}
button{width:100%;padding:12px;margin-top:10px}
.box{background:#263746;padding:10px;margin:10px 0}
</style>
</head>
<body>

<h3>RUTIK JAVASCRIPT TEST</h3>

<div class="box" id="load">JAVASCRIPT NOT STARTED</div>

<input type="file" id="file">

<button id="btn">TEST BUTTON</button>

<div class="box" id="output">WAITING...</div>

<script>

document.getElementById("load").innerHTML=
"1. JAVASCRIPT LOADED SUCCESSFULLY";

document.getElementById("file").onchange=function(){

var f=this.files[0];

if(f){
document.getElementById("output").innerHTML=
"FILE SELECTED<br>"+f.name+"<br>"+f.size+" BYTES";
}

};

document.getElementById("btn").onclick=function(){

document.getElementById("output").innerHTML+=
"<br>BUTTON CLICK SUCCESSFUL";

};

</script>

</body>
</html>
