<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK ERROR TEST</title>
<style>
body{background:#111;color:#00ff00;font:12px Arial;padding:8px}
.box{border:1px solid #00ff00;padding:8px;margin:8px 0;word-wrap:break-word}
button{width:100%;padding:12px;margin:5px 0}
</style>
</head>
<body>

<h3>RUTIK ERROR DETECTOR</h3>

<div class="box" id="status">1. HTML LOADED</div>
<div class="box" id="output">2. WAITING</div>
<div class="box" id="errors">ERROR: NONE</div>

<button id="btn">START TEST</button>

<script>

var statusBox=document.getElementById("status");
var output=document.getElementById("output");
var errorBox=document.getElementById("errors");

function log(t){
 output.innerHTML+="<br>"+t;
}

function err(t){
 errorBox.innerHTML+="<br>"+t;
}

statusBox.innerHTML="2. JAVASCRIPT STARTED";

window.onerror=function(msg,url,line,col){
 err("ERROR: "+msg+" | LINE: "+line+" | COLUMN: "+col);
 statusBox.innerHTML="JAVASCRIPT ERROR";
 return false;
};

document.getElementById("btn").onclick=function(){

 statusBox.innerHTML="3. BUTTON CLICKED";
 output.innerHTML="TEST RESULTS:";

 try{
 var p=typeof Promise;
 log("PROMISE: "+p);
 }catch(e){err(e.name+": "+e.message);}

 try{
 var f=typeof FileReader;
 log("FILEREADER: "+f);
 }catch(e){err(e.name+": "+e.message);}

 try{
 var a=new Function("return (async function(){return 1;})();");
 log("ASYNC/AWAIT: SUPPORTED");
 }catch(e){
 log("ASYNC/AWAIT: NOT SUPPORTED");
 err(e.name+": "+e.message);
 }

 statusBox.innerHTML="4. TEST COMPLETED";
};

</script>
</body>
</html>
