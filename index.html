<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTIK JAVA INSTALLER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:7px;background:#101820;
 color:white;font-family:Arial;font-size:13px;
}
.header{
 background:#073b4c;border:1px solid #00e5ff;
 text-align:center;padding:10px 2px;
}
h2{color:#00e5ff;font-size:16px;margin:0}
.box{
 background:#263238;padding:9px;
 margin-top:9px;border:1px solid #455a64;
}
input{width:100%;margin:12px 0;color:white}
button{
 width:100%;padding:12px;margin:6px 0;
 background:#00bcd4;border:0;
 font-weight:bold;font-size:13px;
}
#status{
 background:#17252d;border:1px solid #00bcd4;
 padding:9px;margin-top:9px;
 line-height:1.6;overflow-wrap:anywhere;
}
.green{color:#00ff90}
.red{color:#ff5252}
.yellow{color:#ffeb3b}
</style>
</head>
<body>

<div class="header">
<h2>RUTIK JAVA INSTALLER</h2>
V1.2 FILEREADER TEST
</div>

<div class="box">
<b>SELECT JAR / JAD FILE</b>
<input type="file" id="file" accept=".jar,.jad">
<div id="info">No file selected.</div>
</div>

<div class="box">
<button onclick="testFile()">TEST FILE READER</button>
<button onclick="resetApp()">RESET</button>
<div id="status">Waiting for file...</div>
</div>

<script>
var picker=document.getElementById("file");
var info=document.getElementById("info");
var statusBox=document.getElementById("status");
var selectedFile=null;

picker.onchange=function(){

 selectedFile=null;

 if(!picker.files || picker.files.length===0){
  info.innerHTML="No file selected.";
  return;
 }

 selectedFile=picker.files[0];

 info.innerHTML=
 "<span class='green'>FILE SELECTED</span><br>"+
 "Name: "+selectedFile.name+"<br>"+
 "Size: "+selectedFile.size+" bytes";

 statusBox.innerHTML=
 "<span class='green'>FILE READY</span>";
};

function testFile(){

 if(!selectedFile){
  statusBox.innerHTML=
  "<span class='red'>Please select a file first.</span>";
  return;
 }

 if(typeof FileReader==="undefined"){
  statusBox.innerHTML=
  "<span class='red'>FileReader NOT SUPPORTED</span>";
  return;
 }

 if(!selectedFile.slice){
  statusBox.innerHTML=
  "<span class='red'>File slicing NOT SUPPORTED</span>";
  return;
 }

 statusBox.innerHTML=
 "<span class='yellow'>READING FIRST 64 BYTES...</span>";

 try{

  var reader=new FileReader();

  reader.onload=function(){

   var result=reader.result;
   var output="";

   if(typeof result==="string"){
    for(var i=0;i<result.length;i++){
     output+=result.charCodeAt(i).toString(16)+" ";
    }
   }else{
    var bytes=new Uint8Array(result);
    for(var j=0;j<bytes.length;j++){
     output+=("0"+bytes[j].toString(16)).slice(-2)+" ";
    }
   }

   statusBox.innerHTML=
   "<span class='green'>FILEREADER SUCCESS</span><br>"+
   "Bytes read: "+(result.byteLength || result.length)+"<br>"+
   "Data: "+output+"<br><br>"+
   "FileReader is working.";
  };

  reader.onerror=function(){
   statusBox.innerHTML=
   "<span class='red'>READ ERROR</span><br>"+
   (reader.error ? reader.error.message : "Unknown error");
  };

  reader.readAsArrayBuffer(selectedFile.slice(0,64));

 }catch(e){

  statusBox.innerHTML=
  "<span class='red'>ERROR</span><br>"+
  e.name+"<br>"+e.message;

 }
}

function resetApp(){
 selectedFile=null;
 picker.value="";
 info.innerHTML="No file selected.";
 statusBox.innerHTML="Waiting for file...";
}
</script>

</body>
</html>
