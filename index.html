
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101820">
<title>RUTIK TUBE</title>

<style>
:root {
  --bg: #101820;
  --panel: #1b2935;
  --text: #f4f7fb;
  --muted: #a9bac8;
  --accent: #ff3b30;
  --focus: #ffd166;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Roboto, sans-serif;
}

body {
  font-size: 13px;
}

.app {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  background: #182632;
  border-bottom: 2px solid var(--accent);
  padding: 7px 8px;
}

.brand {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 1px;
}

.brand span {
  color: var(--accent);
}

.sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

main {
  padding: 8px;
  flex: 1;
}

h2 {
  font-size: 13px;
  margin: 5px 0 8px;
}

label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin: 8px 0 4px;
}

input {
  width: 100%;
  min-width: 0;
  background: #fff;
  color: #111;
  border: 2px solid #8293a1;
  border-radius: 4px;
  padding: 8px 6px;
  font-size: 13px;
  outline: none;
}

input:focus,
button:focus,
a:focus {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

button,
.linkbtn {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 4px;
  background: var(--accent);
  color: white;
  font-weight: bold;
  padding: 9px 6px;
  margin-top: 7px;
  text-align: center;
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
}

button.secondary,
.linkbtn.secondary {
  background: #304657;
}

.note {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
  margin-top: 8px;
}

.card {
  background: var(--panel);
  border: 1px solid #344958;
  border-radius: 5px;
  padding: 8px;
  margin-top: 9px;
}

#playerWrap {
  display: none;
  margin-top: 9px;
}

#player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 0;
}

.row {
  display: flex;
  gap: 6px;
}

.row > * {
  flex: 1;
  min-width: 0;
}

footer {
  background: #182632;
  border-top: 1px solid #344958;
  padding: 6px 8px;
  text-align: center;
  color: var(--muted);
  font-size: 9px;
}

@media (max-width: 180px) {
  body {
    font-size: 11px;
  }

  header {
    padding: 5px;
  }

  .brand {
    font-size: 15px;
  }

  main {
    padding: 6px;
  }

  input {
    font-size: 12px;
    padding: 7px 4px;
  }

  button,
  .linkbtn {
    font-size: 11px;
    padding: 8px 4px;
  }

  .card {
    padding: 6px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    RUTIK <span>TUBE</span>
  </div>
  <div class="sub">
    Lightweight YouTube Search
  </div>
</header>

<main>

  <h2>Search YouTube</h2>

  <form id="searchForm">

    <label for="query">
      Video / Channel name
    </label>

    <input
      id="query"
      type="text"
      placeholder="Search here..."
      autocomplete="off"
    >

    <button type="submit">
      SEARCH
    </button>

  </form>

  <div class="card">

    <div style="font-weight:bold">
      Play a video
    </div>

    <label for="videoId">
      Paste YouTube link or video ID
    </label>

    <input
      id="videoId"
      type="text"
      placeholder="Video URL / ID"
    >

    <button id="playBtn" type="button">
      PLAY VIDEO
    </button>

    <div id="playerWrap">

      <iframe
        id="player"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>

      <a
        id="openVideo"
        class="linkbtn secondary"
        target="_blank"
        rel="noopener">
        OPEN ON YOUTUBE
      </a>

    </div>

  </div>

  <div class="card">

    <div style="font-weight:bold">
      Quick links
    </div>

    <div class="row">

      <a
        class="linkbtn secondary"
        href="https://m.youtube.com/"
        target="_blank"
        rel="noopener">
        YouTube
      </a>

      <a
        class="linkbtn secondary"
        href="https://www.youtube.com/feed/trending"
        target="_blank"
        rel="noopener">
        Trending
      </a>

    </div>

    <div class="note">
      Search opens YouTube results.
      Video playback depends on YouTube
      and Cloud Phone browser support.
    </div>

  </div>

</main>

<footer>
  Made for 128 × 160 keypad phones
</footer>

</div>

<script>

(function() {

  const $ = id => document.getElementById(id);

  // YOUTUBE SEARCH

  function search() {

    const q = $('query').value.trim();

    if (!q) {
      $('query').focus();
      return;
    }

    location.href =
      'https://m.youtube.com/results?search_query=' +
      encodeURIComponent(q);

  }

  $('searchForm').addEventListener(
    'submit',
    function(e) {
      e.preventDefault();
      search();
    }
  );


  // EXTRACT YOUTUBE VIDEO ID

  function extractId(value) {

    value = value.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
      return value;
    }

    try {

      const u = new URL(value);

      if (u.hostname.indexOf('youtu.be') !== -1) {
        return u.pathname.split('/').filter(Boolean)[0] || '';
      }

      if (u.searchParams.get('v')) {
        return u.searchParams.get('v');
      }

      const parts = u.pathname.split('/').filter(Boolean);

      const i = parts.findIndex(
        p => p === 'embed' || p === 'shorts' || p === 'live'
      );

      if (i >= 0 && parts[i + 1]) {
        return parts[i + 1];
      }

    } catch(e) {}

    return '';

  }


  // PLAY VIDEO

  $('playBtn').addEventListener('click', function() {

    const id = extractId($('videoId').value);

    if (!id) {
      $('videoId').focus();
      $('videoId').placeholder = 'Enter a valid YouTube link';
      return;
    }

    const url =
      'https://www.youtube.com/watch?v=' +
      encodeURIComponent(id);

    $('player').src =
      'https://www.youtube-nocookie.com/embed/' +
      encodeURIComponent(id);

    $('openVideo').href = url;

    $('playerWrap').style.display = 'block';

    $('playerWrap').scrollIntoView();

  });


  // KEYPAD NAVIGATION

  function controls() {

    return Array.from(
      document.querySelectorAll('input, button, a')
    ).filter(el => el.offsetParent !== null);

  }

  document.addEventListener('keydown', function(e) {

    if (
      e.key === 'ArrowDown' ||
      e.key === 'ArrowUp'
    ) {

      const list = controls();

      const i = list.indexOf(document.activeElement);

      if (i < 0) return;

      e.preventDefault();

      const next =
        e.key === 'ArrowDown'
          ? Math.min(i + 1, list.length - 1)
          : Math.max(i - 1, 0);

      list[next].focus();

    }

  });

})();

</script>

</body>
</html>
