<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST 8.8</title>

<style>
body {
    background:#101820;
    color:white;
    font-family:Arial,sans-serif;
    font-size:13px;
    padding:8px;
}
h3 {
    color:#00e5ff;
    text-align:center;
}
button,input {
    width:100%;
    padding:10px;
    margin:6px 0;
    box-sizing:border-box;
}
button {
    background:#00a8cc;
    color:white;
    border:0;
}
#result {
    background:#202c36;
    padding:9px;
    white-space:pre-wrap;
    word-wrap:break-word;
    line-height:1.5;
}
</style>
</head>

<body>

<h3>TEST 8.8</h3>
<h4>ALL CLASS FILES ANALYZER</h4>

<input type="file" id="fileInput" accept=".jar,.zip">

<button id="scanBtn">SCAN ALL CLASS FILES</button>

<div id="result">STATUS: WAITING</div>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>

var result = document.getElementById("result");

function showError(step,e) {
    result.textContent =
        "STATUS: ERROR\n" +
        "STEP: " + step + "\n" +
        "ERROR NAME: " + (e.name || "Error") + "\n" +
        "ERROR MESSAGE: " + (e.message || String(e));
}

window.onerror = function(message,source,line,column,error) {
    showError(
        "GLOBAL ERROR - LINE " + line + " COLUMN " + column,
        error || {name:"JavaScript Error",message:message}
    );
    return true;
};

function getJavaVersion(major) {

    if (major === 45) return "Java 1.1";
    if (major === 46) return "Java 1.2";
    if (major === 47) return "Java 1.3";
    if (major === 48) return "Java 1.4";
    if (major === 49) return "Java 5";
    if (major === 50) return "Java 6";
    if (major === 51) return "Java 7";
    if (major === 52) return "Java 8";
    if (major >= 53) return "Java 9 or newer";

    return "Unknown";
}

function inspectClass(bytes) {

    if (!bytes || bytes.length < 10) {
        throw new Error("CLASS FILE TOO SMALL");
    }

    var view = new DataView(
        bytes.buffer,
        bytes.byteOffset,
        bytes.byteLength
    );

    if (view.getUint32(0,false) !== 0xCAFEBABE) {
        throw new Error("INVALID MAGIC NUMBER");
    }

    var minor = view.getUint16(4,false);
    var major = view.getUint16(6,false);
    var cpCount = view.getUint16(8,false);

    var cp = [];
    var pos = 10;
    var i = 1;

    while (i < cpCount) {

        if (pos >= bytes.length) {
            throw new Error("CONSTANT POOL OUT OF RANGE");
        }

        var tag = bytes[pos];
        pos++;

        if (tag === 1) {

            if (pos + 2 > bytes.length) {
                throw new Error("INVALID UTF DATA");
            }

            var len = view.getUint16(pos,false);
            pos += 2;

            if (pos + len > bytes.length) {
                throw new Error("UTF DATA OUT OF RANGE");
            }

            cp[i] = {tag:tag};
            pos += len;

        } else if (tag === 3 || tag === 4) {

            cp[i] = {tag:tag};
            pos += 4;

        } else if (tag === 5 || tag === 6) {

            cp[i] = {tag:tag};
            pos += 8;
            i++;

        } else if (
            tag === 7 || tag === 8 ||
            tag === 16 || tag === 19 ||
            tag === 20
        ) {

            cp[i] = {tag:tag};
            pos += 2;

        } else if (
            tag === 9 || tag === 10 ||
            tag === 11 || tag === 12 ||
            tag === 17 || tag === 18
        ) {

            cp[i] = {tag:tag};
            pos += 4;

        } else if (tag === 15) {

            cp[i] = {tag:tag};
            pos += 3;

        } else {

            throw new Error("UNKNOWN CONSTANT POOL TAG " + tag);

        }

        if (pos > bytes.length) {
            throw new Error("CLASS DATA TRUNCATED");
        }

        i++;
    }

    if (pos + 6 > bytes.length) {
        throw new Error("CLASS HEADER INCOMPLETE");
    }

    return {
        major:major,
        minor:minor,
        cpCount:cpCount
    };
}

document.getElementById("scanBtn").onclick = function() {

    var step = "START";

    try {

        var input = document.getElementById("fileInput");

        if (!input.files || input.files.length === 0) {
            result.textContent = "ERROR: SELECT JAR FILE";
            return;
        }

        if (!window.fflate) {
            throw new Error("FFLATE LIBRARY NOT LOADED");
        }

        var file = input.files[0];

        result.textContent = "STATUS: READING JAR...";

        var reader = new FileReader();

        reader.onerror = function() {
            showError("FILE READER",new Error("FILE READ FAILED"));
        };

        reader.onload = function(event) {

            var currentStep = "UNZIP JAR";

            try {

                var zipBytes = new Uint8Array(event.target.result);

                var files = window.fflate.unzipSync(zipBytes);

                var total = 0;
                var valid = 0;
                var invalid = 0;
                var versions = {};
                var errors = "";
                var details = "";

                currentStep = "SCAN CLASS FILES";

                for (var name in files) {

                    if (
                        files.hasOwnProperty(name) &&
                        name.toLowerCase().slice(-6) === ".class"
                    ) {

                        total++;

                        try {

                            var info = inspectClass(files[name]);

                            valid++;

                            var version =
                                info.major + "." + info.minor;

                            if (!versions[version]) {
                                versions[version] = 0;
                            }

                            versions[version]++;

                            if (details.length < 2500) {
                                details +=
                                    name +
                                    " | " +
                                    getJavaVersion(info.major) +
                                    " | Major: " + info.major +
                                    " | Minor: " + info.minor +
                                    "\n";
                            }

                        } catch(e) {

                            invalid++;

                            errors +=
                                name + "\n" +
                                e.name + ": " +
                                e.message + "\n\n";

                        }
                    }
                }

                currentStep = "DISPLAY RESULTS";

                var versionText = "";

                for (var v in versions) {
                    versionText +=
                        "Major.Minor " + v +
                        " : " + versions[v] + " files\n";
                }

                result.textContent =
                    "STATUS: TEST COMPLETED\n\n" +
                    "JAR FILE: " + file.name + "\n" +
                    "TOTAL CLASS FILES: " + total + "\n" +
                    "VALID CLASS FILES: " + valid + "\n" +
                    "INVALID CLASS FILES: " + invalid + "\n\n" +

                    "JAVA VERSION DISTRIBUTION:\n" +
                    (versionText || "NONE") + "\n" +

                    "CLASS FILE DETAILS:\n" +
                    (details || "NONE") + "\n" +

                    "ERROR DETAILS:\n" +
                    (errors || "NONE") + "\n" +

                    "FINAL ERROR: NONE";

            } catch(e) {

                showError(currentStep,e);

            }
        };

        reader.readAsArrayBuffer(file);

    } catch(e) {

        showError(step,e);

    }

};

</script>

</body>
</html>
