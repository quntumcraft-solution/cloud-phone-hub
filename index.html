<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RUTIK LIVE TV</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#070b14;
 color:white;
 font-family:Arial,sans-serif;
 font-size:10px;
}

.top{
 height:16px;
 min-height:16px;
 padding:2px 4px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#101a2b;
 border-bottom:1px solid #29384d;
}

.logo{
 font-size:9px;
 font-weight:bold;
 color:#44e0c0;
}

#count{
 font-size:7px;
 color:#a9bbd0;
}

main{
 width:100%;
 height:calc(100% - 16px);
 padding:2px;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

/* PLAYER */

.player{
 position:relative;
 width:100%;
 height:30px;
 min-height:30px;
 background:black;
 overflow:hidden;
 border:1px solid #263d57;
}

video{
 width:100%;
 height:100%;
 display:block;
 object-fit:contain;
 background:black;
}

.player-info{
 position:absolute;
 left:2px;
 bottom:1px;
 right:2px;
 padding:1px 2px;
 background:rgba(0,0,0,.75);
 pointer-events:none;
}

#nowName{
 font-size:8px;
 font-weight:bold;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

#playMessage{
 font-size:6px;
 color:#b8d0e4;
 white-space:nowrap;
 overflow:hidden;
}

/* SEARCH */

.search-row{
 display:flex;
 width:100%;
 height:18px;
 min-height:18px;
 gap:2px;
 margin-top:2px;
}

#search{
 flex:1;
 min-width:0;
 width:100%;
 padding:2px 4px;
 color:white;
 background:#14243a;
 border:1px solid #354b66;
 border-radius:2px;
 font-size:8px;
}

#clear{
 width:18px;
 padding:0;
 color:white;
 background:#8b2635;
 border:0;
 font-size:9px;
}

/* CATEGORIES */

.categories{
 width:100%;
 height:20px;
 min-height:20px;
 display:flex;
 gap:3px;
 overflow-x:auto;
 overflow-y:hidden;
 white-space:nowrap;
 padding:2px 1px;
 background:#0d1726;
}

.categories::-webkit-scrollbar{
 display:none;
}

.cat{
 flex:none;
 height:15px;
 padding:1px 6px;
 color:#d8e3ef;
 background:#18283d;
 border:1px solid #354b66;
 border-radius:8px;
 font-size:7px;
}

.cat.selected{
 color:white;
 background:#087d70;
 border-color:#24c9b2;
}

.cat.key-focused{
 outline:1px solid #43ddc0;
 background:#24506a;
}

/* LIST TITLE */

.list-head{
 height:12px;
 min-height:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:1px 3px;
 color:#9eb1c8;
 font-size:7px;
 font-weight:bold;
}

/* CHANNEL LIST */

.channels{
 flex:1;
 min-height:0;
 width:100%;
 overflow-y:auto;
 overflow-x:hidden;
 padding:2px;
 background:#0d1726;
 border:1px solid #263d57;
}

.channel{
 display:block;
 width:100%;
 min-height:20px;
 margin-bottom:2px;
 padding:2px 3px;
 color:white;
 text-align:left;
 background:#14243a;
 border:1px solid #2c425e;
 border-radius:2px;
 overflow:hidden;
}

.channel.focused{
 background:#1c3850;
 border:2px solid #43ddc0;
}

.channel.playing{
 border-color:#e64d5b;
}

.channel strong{
 display:block;
 font-size:8px;
 line-height:1.2;
 overflow-wrap:anywhere;
}

.channel small{
 display:block;
 font-size:6px;
 color:#9fb4cc;
}

.fav{
 float:right;
 margin-left:3px;
 padding:0;
 color:#ffd45a;
 background:transparent;
 border:0;
 font-size:11px;
}

.remove-channel{
 float:right;
 width:15px;
 height:14px;
 margin-left:3px;
 padding:0;
 color:white;
 background:#702331;
 border:1px solid #e34b5b;
 border-radius:2px;
 font-size:10px;
}

.hint{
 padding:4px;
 color:#aebed0;
 font-size:8px;
}

.controls{
 height:10px;
 min-height:10px;
 padding-top:2px;
 text-align:center;
 color:#8298b2;
 font-size:6px;
}

button:focus,input:focus{
 outline:1px solid #43ddc0;
}
</style>
</head>

<body>

<header class="top">
 <div class="logo">RUTIK LIVE TV</div>
 <div id="count">Loading...</div>
</header>

<main>

 <section class="player">

  <video id="video" controls playsinline preload="none"></video>

  <div class="player-info">
   <div id="nowName">No channel playing</div>
   <div id="playMessage">Select channel and press OK</div>
  </div>

 </section>

 <div class="search-row">
  <input id="search" type="text" placeholder="Search channel">
  <button id="clear" type="button">X</button>
 </div>

 <nav id="categories" class="categories">

  <button class="cat selected" data-cat="all">ALL</button>
  <button class="cat" data-cat="Marathi">MAR</button>
  <button class="cat" data-cat="Hindi">HIN</button>
  <button class="cat" data-cat="News">NEWS</button>
  <button class="cat" data-cat="Entertainment">ENT</button>
  <button class="cat" data-cat="Movies">MOV</button>
  <button class="cat" data-cat="Sports">SPORT</button>
  <button class="cat" data-cat="Documentary & Lifestyle">DOC</button>
  <button class="cat" data-cat="Favourites">FAV</button>

 </nav>

 <div class="list-head">
  <span id="categoryTitle">ALL CHANNELS</span>
  <span id="shown"></span>
 </div>

 <div id="channels" class="channels">
  <div class="hint">Loading channels...</div>
 </div>

 <div class="controls">
  UP/DOWN: CHANNEL | LEFT/RIGHT: CATEGORY | OK: PLAY
 </div>

</main>

<script>
(function(){

"use strict";

/* PLAYLISTS */

var PLAYLISTS = [

 // INDIAN TV
 "https://raw.githubusercontent.com/iptv-org/iptv/refs/heads/master/streams/in.m3u",

 // SPORTS
 "https://iptv-org.github.io/iptv/categories/sports.m3u"

];


/* ELEMENTS */

var video=document.getElementById("video");
var box=document.getElementById("channels");
var search=document.getElementById("search");
var count=document.getElementById("count");
var shown=document.getElementById("shown");
var nowName=document.getElementById("nowName");
var msg=document.getElementById("playMessage");
var categoriesEl=document.getElementById("categories");

var buttons=Array.prototype.slice.call(
 categoriesEl.querySelectorAll(".cat")
);


/* VARIABLES */

var all=[];
var filtered=[];
var seenUrls={};

var activeCat="all";
var focusIndex=0;
var categoryFocus=0;
var navMode="channels";
var playingUrl="";

var favs={};
var removed={};

try{
 favs=JSON.parse(
  localStorage.getItem("rutik_tv_favs")||"{}"
 )||{};
}catch(e){}

try{
 removed=JSON.parse(
  localStorage.getItem("rutik_tv_removed")||"{}"
 )||{};
}catch(e){}


/* PLAYER INITIALIZATION */

video.autoplay=false;
video.removeAttribute("autoplay");
video.preload="none";

try{
 video.pause();
 video.removeAttribute("src");
 video.load();
}catch(e){}


/* MESSAGE */

function say(t){
 msg.textContent=t;
}


/* ATTRIBUTE */

function attr(line,key){

 var re=new RegExp(
  key+'="([^"]*)"',"i"
 );

 return (line.match(re)||[])[1]||"";
}


/* PARSER */

function parseM3U(text){

 var result=[];
 var meta=null;

 var lines=String(text)
  .replace(/\r/g,"")
  .split("\n");

 for(var i=0;i<lines.length;i++){

  var line=lines[i].trim();

  if(!line) continue;

  if(line.indexOf("#EXTINF:")===0){

   var comma=line.lastIndexOf(",");

   meta={
    name:comma>=0?
     line.substring(comma+1).trim():
     "TV Channel",

    group:attr(line,"group-title"),
    lang:attr(line,"tvg-language"),
    raw:line
   };

  }else if(line.charAt(0)!=="#" && meta){

   meta.url=line;
   result.push(meta);
   meta=null;

  }
 }

 return result;
}


/* CATEGORY DETECTION */

function classify(ch){

 var s=(
  ch.name+" "+
  ch.group+" "+
  ch.lang+" "+
  ch.raw
 ).toLowerCase();

 var cats=[];

 if(/\b(marathi|mar|मराठी)\b/.test(s)){
  cats.push("Marathi");
 }

 if(/\b(hindi|hin|हिंदी)\b/.test(s)){
  cats.push("Hindi");
 }

 if(/\b(news|न्यूज|बातम्या)\b/.test(s)){
  cats.push("News");
 }

 if(/\b(movie|movies|cinema|film|films)\b/.test(s)){
  cats.push("Movies");
 }

 if(/\b(sport|sports|cricket|football|tennis|badminton)\b/.test(s)){
  cats.push("Sports");
 }

 if(/\b(documentary|lifestyle|travel|food|nature|wildlife)\b/.test(s)){
  cats.push("Documentary & Lifestyle");
 }

 if(/\b(entertainment|serial|drama)\b/.test(s)){
  cats.push("Entertainment");
 }

 if(cats.length===0){
  cats.push("Entertainment");
 }

 return cats;
}


/* PREPARE */

function prepare(text){

 var parsed=parseM3U(text);

 for(var i=0;i<parsed.length;i++){

  var ch=parsed[i];

  if(!ch.url) continue;
  if(removed[ch.url]) continue;
  if(seenUrls[ch.url]) continue;

  seenUrls[ch.url]=true;
  ch.cats=classify(ch);

  all.push(ch);
 }
}


/* FILTER */

function currentRows(){

 var q=(search.value||"").toLowerCase().trim();

 return all.filter(function(ch){

  var catOK=
   activeCat==="all" ||

   (
    activeCat==="Favourites"
     ? !!favs[ch.url]
     : ch.cats.indexOf(activeCat)>=0
   );

  return catOK &&
   ch.name.toLowerCase().indexOf(q)>=0;

 });
}


/* SAVE */

function saveData(){

 try{
  localStorage.setItem(
   "rutik_tv_favs",
   JSON.stringify(favs)
  );

  localStorage.setItem(
   "rutik_tv_removed",
   JSON.stringify(removed)
  );
 }catch(e){}
}


/* REMOVE CHANNEL */

function removeChannel(ch){

 if(!ch) return;

 var ok=true;

 try{
  ok=confirm("Remove this channel?");
 }catch(e){}

 if(!ok) return;

 removed[ch.url]=true;
 delete favs[ch.url];

 saveData();

 if(playingUrl===ch.url){
  stopPlayback();
 }

 filtered=currentRows();

 focusIndex=Math.min(
  focusIndex,
  filtered.length-1
 );

 if(focusIndex<0) focusIndex=0;

 render();
 say("Channel removed");
}


/* FAVOURITE */

function toggleFav(ch){

 if(!ch) return;

 if(favs[ch.url]){
  delete favs[ch.url];
 }else{
  favs[ch.url]=true;
 }

 saveData();

 filtered=currentRows();
 render();

 say("Favourite updated");
}


/* RENDER */

function render(){

 filtered=currentRows();
 box.innerHTML="";

 document.getElementById("categoryTitle").textContent=
  activeCat==="all"?
   "ALL CHANNELS":
   activeCat.toUpperCase();

 if(focusIndex>=filtered.length){
  focusIndex=filtered.length-1;
 }

 if(filtered.length===0){

  box.innerHTML=
   '<div class="hint">No channels found</div>';

  shown.textContent="0";
  return;
 }

 if(focusIndex<0) focusIndex=0;

 var visible=4;

 var start=Math.max(0,focusIndex-1);
 var end=Math.min(filtered.length,start+visible);

 if(focusIndex>=end){
  start=focusIndex-visible+1;
  end=focusIndex+1;
 }

 for(var i=start;i<end;i++){

  (function(index){

   var ch=filtered[index];

   var row=document.createElement("div");

   row.className="channel";

   if(index===focusIndex){
    row.className+=" focused";
   }

   if(ch.url===playingUrl){
    row.className+=" playing";
   }

   var removeBtn=document.createElement("button");
   removeBtn.className="remove-channel";
   removeBtn.type="button";
   removeBtn.textContent="X";

   removeBtn.onclick=function(e){
    e.stopPropagation();
    removeChannel(ch);
   };

   var fav=document.createElement("button");
   fav.className="fav";
   fav.type="button";
   fav.textContent=favs[ch.url]?"★":"☆";

   fav.onclick=function(e){
    e.stopPropagation();
    toggleFav(ch);
   };

   var name=document.createElement("strong");
   name.textContent=(index+1)+". "+ch.name;

   var small=document.createElement("small");
   small.textContent=ch.cats.join(" / ");

   row.appendChild(removeBtn);
   row.appendChild(fav);
   row.appendChild(name);
   row.appendChild(small);

   row.onclick=function(){
    focusIndex=index;
    navMode="channels";
    render();
    say("Selected: "+ch.name+" - Press OK");
   };

   box.appendChild(row);

  })(i);
 }

 shown.textContent=(focusIndex+1)+"/"+filtered.length;

}


/* MOVE CHANNEL */

function moveChannel(direction){

 if(!filtered.length) return;

 focusIndex+=direction;

 if(focusIndex<0){
  focusIndex=filtered.length-1;
 }

 if(focusIndex>=filtered.length){
  focusIndex=0;
 }

 navMode="channels";
 render();

 say("Selected: "+filtered[focusIndex].name);
}


/* FAST PLAY - OPTIMIZED */

function playChannel(){

 if(!filtered.length || focusIndex<0) return;

 var ch=filtered[focusIndex];

 if(!ch || !ch.url) return;

 playingUrl=ch.url;
 nowName.textContent=ch.name;

 say("Connecting...");

 render();

 try{

  /* Same channel: do not reload */

  if(video.src===ch.url){

   var samePlay=video.play();

   if(samePlay && samePlay.catch){
    samePlay.catch(function(){
     say("Stream unavailable or unsupported");
    });
   }

   return;
  }

  /*
   New channel:
   Directly change source.
   Avoid unnecessary pause(), removeAttribute()
   and load() calls.
  */

  video.src=ch.url;

  var p=video.play();

  if(p && p.catch){

   p.catch(function(){

    say("Stream unavailable or unsupported");

   });

  }

 }catch(e){

  say("Unable to start channel");

 }

}


/* STOP */

function stopPlayback(){

 try{
  video.pause();
  video.removeAttribute("src");
  video.load();
 }catch(e){}

 playingUrl="";
 nowName.textContent="No channel playing";

 say("Playback stopped");
 render();
}


/* CATEGORY PAINT */

function paintCategory(){

 buttons.forEach(function(b,i){

  if(navMode==="categories" && i===categoryFocus){
   b.classList.add("key-focused");
  }else{
   b.classList.remove("key-focused");
  }

 });

 var selected=buttons[categoryFocus];

 if(selected && selected.scrollIntoView){
  try{
   selected.scrollIntoView({
    block:"nearest",
    inline:"nearest"
   });
  }catch(e){
   selected.scrollIntoView(false);
  }
 }
}


/* ACTIVATE CATEGORY */

function activateCategory(index){

 if(index<0 || index>=buttons.length) return;

 categoryFocus=index;

 activeCat=buttons[index].getAttribute("data-cat");

 buttons.forEach(function(b,i){

  if(i===index){
   b.classList.add("selected");
  }else{
   b.classList.remove("selected");
  }

 });

 focusIndex=0;
 navMode="channels";

 render();
 paintCategory();

 say("Category: "+activeCat);
}


/* CATEGORY CLICK */

categoriesEl.addEventListener("click",function(e){

 var node=e.target;

 while(
  node &&
  node!==categoriesEl &&
  !(node.classList &&
    node.classList.contains("cat"))
 ){
  node=node.parentNode;
 }

 if(!node || node===categoriesEl) return;

 activateCategory(buttons.indexOf(node));
});


/* SEARCH */

search.onfocus=function(){
 navMode="search";
};

search.oninput=function(){
 focusIndex=0;
 render();
};

search.onkeydown=function(e){

 var k=e.keyCode||0;

 if(k===13){

  search.blur();
  navMode="channels";
  focusIndex=0;
  render();
 }
};


/* CLEAR */

document.getElementById("clear").onclick=function(){

 search.value="";
 focusIndex=0;
 navMode="channels";
 render();

};


/* KEYPAD */

document.addEventListener("keydown",function(e){

 var key=e.key||"";
 var code=e.keyCode||0;

 var tag=(
  document.activeElement &&
  document.activeElement.tagName||""
 ).toLowerCase();

 if(tag==="input"){

  if(key==="Escape" || code===27){
   search.blur();
   navMode="channels";
  }

  return;
 }


 /* UP */

 if(
  key==="ArrowUp" ||
  code===38 ||
  key==="8" ||
  code===56
 ){

  e.preventDefault();
  moveChannel(-1);
  return;
 }


 /* DOWN */

 if(
  key==="ArrowDown" ||
  code===40 ||
  key==="2" ||
  code===50
 ){

  e.preventDefault();
  moveChannel(1);
  return;
 }


 /* LEFT */

 if(
  key==="ArrowLeft" ||
  code===37 ||
  key==="4" ||
  code===52
 ){

  e.preventDefault();

  navMode="categories";

  categoryFocus=Math.max(
   0,
   categoryFocus-1
  );

  paintCategory();
  return;
 }


 /* RIGHT */

 if(
  key==="ArrowRight" ||
  code===39 ||
  key==="6" ||
  code===54
 ){

  e.preventDefault();

  navMode="categories";

  categoryFocus=Math.min(
   buttons.length-1,
   categoryFocus+1
  );

  paintCategory();
  return;
 }


 /* OK */

 if(
  key==="Enter" ||
  code===13
 ){

  e.preventDefault();

  if(navMode==="categories"){
   activateCategory(categoryFocus);
  }else{
   playChannel();
  }

  return;
 }


 /* SEARCH */

 if(key==="0" || code===48){

  e.preventDefault();
  search.focus();
  return;
 }


 /* FAVOURITE */

 if(
  key==="5" ||
  code===53
 ){

  e.preventDefault();

  toggleFav(filtered[focusIndex]);
  return;
 }


 /* STOP */

 if(key==="Escape" || code===27){

  stopPlayback();
  return;
 }

});


/* VIDEO EVENTS */

video.addEventListener("playing",function(){
 say("LIVE: "+nowName.textContent);
});

video.addEventListener("waiting",function(){
 say("Buffering...");
});

video.addEventListener("error",function(){
 say("Stream unavailable");
});


/* LOAD PLAYLISTS */

function loadPlaylist(index){

 if(index>=PLAYLISTS.length){

  filtered=currentRows();
  focusIndex=0;

  count.textContent=all.length+" CH";

  render();

  say("All playlists loaded");
  return;
 }

 if(typeof fetch!=="function"){

  count.textContent="Fetch unsupported";

  box.innerHTML=
   '<div class="hint">Browser does not support playlist loading</div>';

  return;
 }

 count.textContent=
  all.length+" CH | Loading "+(index+1)+"/"+PLAYLISTS.length;

 fetch(PLAYLISTS[index])

 .then(function(response){

  if(!response.ok){
   throw new Error("Playlist error");
  }

  return response.text();

 })

 .then(function(text){

  if(text.indexOf("#EXTM3U")<0){
   throw new Error("Invalid playlist");
  }

  prepare(text);

  filtered=currentRows();
  render();

  count.textContent=all.length+" CH";

 })

 .catch(function(){

  /* Continue even if one playlist fails */

 })

 .then(function(){

  loadPlaylist(index+1);

 });

}


/* START */

loadPlaylist(0);

})();
</script>

</body>
 </html>
