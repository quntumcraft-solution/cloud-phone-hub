<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Phone Test</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  padding: 10px;
  font-size: 14px;
}
h3 { color: #00e0a0; }
button, input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  font-size: 14px;
}
#result {
  background: #263449;
  padding: 10px;
  line-height: 2;
  overflow-wrap: anywhere;
}
</style>
</head>
<body><h3>CLOUD PHONE TEST</h3>
<div id="result">Testing...</div><h3>1. FILE SELECT TEST</h3>
<input type="file" id="file"><div id="filename">No file selected</div><h3>2. DOWNLOAD TEST</h3>
<button id="download">DOWNLOAD TEST FILE</button><script>
async function test() {
  let r = document.getElementById("result");

  if (!navigator.hasFeature) {
    r.innerHTML = "Cloud Phone API: NOT FOUND";
    return;
  }

  try {
    let upload = await navigator.hasFeature("FileUpload");
    let download = await navigator.hasFeature("FileDownload");

    r.innerHTML =
      "FileUpload: " + upload +
      "<br>FileDownload: " + download;
  } catch(e) {
    r.innerHTML = "Error: " + e.message;
  }
}

document.getElementById("file").onchange = function() {
  document.getElementById("filename").innerText =
    this.files.length ? this.files[0].name : "No file";
};

document.getElementById("download").onclick = function() {
  let blob = new Blob(
    ["RUTIK FAST SHARE DOWNLOAD TEST"],
    {type:"text/plain"}
  );

  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = "RUTIK-TEST.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 5000);
};

test();
</script></body>
</html>
