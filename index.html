<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cloud Phone Web Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff;color:#111;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}header{height:30px;flex:0 0 30px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
#screen{flex:1;overflow:auto;padding:3px}.row{display:flex;align-items:center;gap:5px;min-height:28px;padding:3px;border-bottom:1px solid #ddd}
.sel{background:#111;color:#fff}.icon{width:20px;height:20px;object-fit:contain;flex:0 0 20px}.fallback{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#ddd;color:#111;font-weight:bold;border-radius:3px;flex:0 0 20px}
.num{width:24px;flex:0 0 24px}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cat{font-weight:bold;background:#eee;padding:4px;margin:2px 0}
footer{height:28px;flex:0 0 28px;border-top:1px solid #aaa;display:flex;justify-content:space-between;align-items:center;padding:0 5px;font-size:10px}
input{width:100%;height:28px;border:1px solid #999;padding:3px;font-size:13px}
#fitbar{height:25px;display:flex;gap:3px;padding:2px;border-bottom:1px solid #aaa;background:#eee}
#fitbar button{font-size:10px;padding:2px 5px}
</style></head><body><div id="app"><header id="title">WEB HUB</header><div id="fitbar"><button onclick="setFit(1)">FIT</button><button onclick="setFit(1.0)">100%</button><button onclick="setFit(1.25)">125%</button></div><div id="screen"></div>
<footer><span>LSK Menu</span><span>OK Open · RSK Back</span></footer></div>
<script>
const sites=[["Search", "DuckDuckGo", "https://duckduckgo.com/", "duckduckgo"], ["Search", "DuckDuckGo Lite", "https://lite.duckduckgo.com/", ""], ["Search", "Google", "https://www.google.com/", "google"], ["Search", "Bing", "https://www.bing.com/", "bing"], ["Search", "Yahoo", "https://www.yahoo.com/", "yahoo"], ["Info", "Wikipedia", "https://en.wikipedia.org/", "wikipedia"], ["Info", "Wikipedia Mobile", "https://en.m.wikipedia.org/", ""], ["Info", "Wiktionary", "https://en.wiktionary.org/", "wiktionary"], ["Info", "Wikiquote", "https://en.wikiquote.org/", "wikiquote"], ["Info", "Wikibooks", "https://en.wikibooks.org/", "wikibooks"], ["Info", "Wikinews", "https://en.wikinews.org/", "wikinews"], ["Info", "Wikivoyage", "https://en.wikivoyage.org/", "wikivoyage"], ["Info", "Wikisource", "https://en.wikisource.org/", "wikisource"], ["Info", "Internet Archive", "https://archive.org/", "internetarchive"], ["Info", "Project Gutenberg", "https://www.gutenberg.org/", "gutenberg"], ["Weather", "WTTR", "https://wttr.in/", ""], ["Weather", "WTTR Pune", "https://wttr.in/Pune", ""], ["Weather", "Weather.com", "https://weather.com/", "weather"], ["Weather", "AccuWeather", "https://www.accuweather.com/", "accuweather"], ["Weather", "TimeAndDate", "https://www.timeanddate.com/", "timeanddate"], ["News", "Google News", "https://news.google.com/", "googlenews"], ["News", "BBC", "https://www.bbc.com/", "bbc"], ["News", "Reuters", "https://www.reuters.com/", "reuters"], ["News", "The Guardian", "https://www.theguardian.com/", "theguardian"], ["News", "CNN", "https://www.cnn.com/", "cnn"], ["News", "NDTV", "https://www.ndtv.com/", "ndtv"], ["News", "India Today", "https://www.indiatoday.in/", "indiatoday"], ["News", "Hindustan Times", "https://www.hindustantimes.com/", "hindustantimes"], ["News", "The Hindu", "https://www.thehindu.com/", "thehindu"], ["News", "Indian Express", "https://indianexpress.com/", "indianexpress"], ["Video", "YouTube Mobile", "https://m.youtube.com/", "youtube"], ["Video", "YouTube", "https://www.youtube.com/", "youtube"], ["Video", "Dailymotion", "https://www.dailymotion.com/", "dailymotion"], ["Video", "Vimeo", "https://vimeo.com/", "vimeo"], ["Video", "Twitch", "https://www.twitch.tv/", "twitch"], ["Video", "Archive Movies", "https://archive.org/details/movies", ""], ["Video", "TED", "https://www.ted.com/", "ted"], ["Video", "IMDb", "https://www.imdb.com/", "imdb"], ["Video", "Rotten Tomatoes", "https://www.rottentomatoes.com/", "rottentomatoes"], ["Video", "Letterboxd", "https://letterboxd.com/", "letterboxd"], ["Music", "Spotify", "https://open.spotify.com/", "spotify"], ["Music", "SoundCloud", "https://soundcloud.com/", "soundcloud"], ["Music", "Bandcamp", "https://bandcamp.com/", "bandcamp"], ["Music", "Mixcloud", "https://www.mixcloud.com/", "mixcloud"], ["Music", "Last.fm", "https://www.last.fm/", "lastfm"], ["Music", "Genius", "https://genius.com/", "genius"], ["Music", "Musixmatch", "https://www.musixmatch.com/", "musixmatch"], ["Music", "Free Music Archive", "https://freemusicarchive.org/", "freemusicarchive"], ["Social", "WhatsApp Web", "https://web.whatsapp.com/", "whatsapp"], ["Social", "Facebook", "https://www.facebook.com/", "facebook"], ["Social", "Facebook Mobile", "https://m.facebook.com/", ""], ["Social", "Instagram", "https://www.instagram.com/", "instagram"], ["Social", "Reddit", "https://www.reddit.com/", "reddit"], ["Social", "X", "https://x.com/", "x"], ["Social", "Tumblr", "https://www.tumblr.com/", "tumblr"], ["Social", "Pinterest", "https://www.pinterest.com/", "pinterest"], ["Social", "LinkedIn", "https://www.linkedin.com/", "linkedin"], ["Social", "Telegram Web", "https://web.telegram.org/", "telegram"], ["Email", "Gmail", "https://mail.google.com/", "gmail"], ["Email", "Outlook", "https://outlook.live.com/", "microsoftoutlook"], ["Email", "Yahoo Mail", "https://mail.yahoo.com/", "yahoo"], ["Email", "Proton Mail", "https://mail.proton.me/", "protonmail"], ["Email", "Zoho Mail", "https://mail.zoho.com/", "zoho"], ["Work", "Google Drive", "https://drive.google.com/", "googledrive"], ["Work", "Google Docs", "https://docs.google.com/", "googledocs"], ["Work", "Google Calendar", "https://calendar.google.com/", "googlecalendar"], ["Work", "Google Keep", "https://keep.google.com/", "googlekeep"], ["Work", "OneDrive", "https://onedrive.live.com/", "onedrive"], ["AI", "ChatGPT", "https://chatgpt.com/", "openai"], ["AI", "Gemini", "https://gemini.google.com/", "googlegemini"], ["AI", "Copilot", "https://copilot.microsoft.com/", "microsoftcopilot"], ["AI", "Claude", "https://claude.ai/", "claude"], ["AI", "Perplexity", "https://www.perplexity.ai/", "perplexity"], ["AI", "Poe", "https://poe.com/", "poe"], ["AI", "Hugging Face", "https://huggingface.co/", "huggingface"], ["Maps", "Google Maps", "https://maps.google.com/", "googlemaps"], ["Maps", "OpenStreetMap", "https://www.openstreetmap.org/", "openstreetmap"], ["Maps", "MapQuest", "https://www.mapquest.com/", "mapquest"], ["Travel", "Rome2Rio", "https://www.rome2rio.com/", "rome2rio"], ["Travel", "Booking.com", "https://www.booking.com/", "bookingcom"], ["Education", "Khan Academy", "https://www.khanacademy.org/", "khanacademy"], ["Education", "Wikiversity", "https://en.wikiversity.org/", "wikiversity"], ["Education", "Britannica", "https://www.britannica.com/", "britannica"], ["Education", "Stanford Encyclopedia", "https://plato.stanford.edu/", "stanford"], ["Education", "MIT OpenCourseWare", "https://ocw.mit.edu/", "mit"], ["Education", "Coursera", "https://www.coursera.org/", "coursera"], ["Education", "edX", "https://www.edx.org/", "edx"], ["Shopping", "Amazon India", "https://www.amazon.in/", "amazon"], ["Shopping", "Flipkart", "https://www.flipkart.com/", "flipkart"], ["Shopping", "Myntra", "https://www.myntra.com/", "myntra"], ["Shopping", "Meesho", "https://www.meesho.com/", "meesho"], ["Shopping", "eBay", "https://www.ebay.com/", "ebay"], ["Sports", "ESPN", "https://www.espn.com/", "espn"], ["Sports", "Cricbuzz", "https://www.cricbuzz.com/", "cricbuzz"], ["Sports", "ESPNcricinfo", "https://www.espncricinfo.com/", "espncricinfo"], ["Sports", "ICC", "https://www.icc-cricket.com/", "icc"], ["Tools", "Calculator.net", "https://www.calculator.net/", ""], ["Tools", "UnitConverters", "https://www.unitconverters.net/", ""], ["Tools", "QR Code Generator", "https://www.qr-code-generator.com/", ""], ["Tools", "Google Translate", "https://translate.google.com/", "googletranslate"]],cats=["All", "Favorites", "Search", "Info", "Weather", "News", "Video", "Music", "Social", "Email", "Work", "AI", "Maps", "Travel", "Education", "Shopping", "Sports", "Tools"];let mode="home",cat=0,index=0,query="";
let fav=JSON.parse(localStorage.getItem("cloudHubFav")||"[]");
function ico(slug,name){if(!slug)return '<span class="fallback">'+name[0]+'</span>';return '<img class="icon" src="https://cdn.simpleicons.org/'+slug+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="fallback" style="display:none">'+name[0]+'</span>';}
function arr(){let a=sites;if(cat===1)a=sites.filter((_,i)=>fav.includes(i));else if(cat>1)a=sites.filter(s=>s[0]===cats[cat]);if(query)a=a.filter(s=>(s[1]+" "+s[0]).toLowerCase().includes(query.toLowerCase()));return a;}
function render(){let sc=document.getElementById("screen"),t=document.getElementById("title");
if(mode==="home"){t.textContent="WEB HUB";sc.innerHTML='<div class="cat">CATEGORIES</div>'+cats.map((c,i)=>'<div class="row '+(i===index?'sel':'')+'"><span class="num">'+(i+1)+'.</span><span class="name">'+c+(i===1?' ★':'')+'</span></div>').join('');}
else if(mode==="search"){t.textContent="SEARCH";sc.innerHTML='<input id="q" placeholder="Search website" value="'+query.replace(/"/g,'&quot;')+'"><div class="cat">RESULTS</div>'+arr().map((s,i)=>'<div class="row '+(i===index?'sel':'')+'">'+ico(s[3],s[1])+'<span class="num">'+(i+1)+'.</span><span class="name">'+s[1]+'</span></div>').join('');let q=document.getElementById("q");q.focus();q.setSelectionRange(q.value.length,q.value.length);}
else{t.textContent=cats[cat];let a=arr();sc.innerHTML=a.length?a.map((s,i)=>'<div class="row '+(i===index?'sel':'')+'">'+ico(s[3],s[1])+'<span class="num">'+(i+1)+'.</span><span class="name">'+s[1]+'</span></div>').join(''):'<div style="padding:8px">No websites.</div>';}
let e=sc.querySelector(".sel");if(e)e.scrollIntoView({block:"nearest"});}
function move(n){let a=mode==="home"?cats:arr();if(!a.length)return;index=(index+n+a.length)%a.length;render();}
function setFit(z){document.getElementById("screen").style.zoom=String(z);localStorage.setItem("cloudHubZoom",String(z));}
function openSite(){let s=arr()[index];if(s){sessionStorage.setItem("cloudHubReturn",location.href);location.href=s[2];}}
function back(){if(mode==="home")return;mode="home";cat=0;index=0;query="";render();}
function favToggle(){let s=arr()[index];if(!s)return;let r=sites.indexOf(s),p=fav.indexOf(r);if(p<0)fav.push(r);else fav.splice(p,1);localStorage.setItem("cloudHubFav",JSON.stringify(fav));render();}
document.addEventListener("keydown",e=>{if(mode==="search"&&document.activeElement?.id==="q"){if(e.key==="Escape"||e.key==="ArrowLeft"){back();return}if(e.key==="Enter"){document.activeElement.blur();index=0;render();return}query=document.getElementById("q").value;setTimeout(render,0);return}
if(e.key==="ArrowDown"||e.key==="2")move(1);else if(e.key==="ArrowUp"||e.key==="8")move(-1);
else if(e.key==="Enter"||e.key==="ArrowRight"||e.key==="5"){if(mode==="home"){if(index===0){mode="list";cat=0}else if(index===1){mode="list";cat=1}else{mode="list";cat=index}index=0;render()}else openSite();}
else if(e.key==="ArrowLeft"||e.key==="Escape"||e.key==="#")back();else if(e.key==="*")favToggle();else if(e.key==="0"){mode="search";index=0;render();}});
document.addEventListener("click",e=>{let r=e.target.closest(".row");if(!r)return;let rows=[...document.querySelectorAll(".row")];index=rows.indexOf(r);if(mode==="home"){if(index===0){mode="list";cat=0}else if(index===1){mode="list";cat=1}else{mode="list";cat=index}index=0;render();}else openSite();});
setFit(parseFloat(localStorage.getItem("cloudHubZoom")||"1"));render();
</script></body></html>
