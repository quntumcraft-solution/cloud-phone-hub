<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST 8.12</title>

<style>
body {
    background: #101010;
    color: #00ff80;
    font-family: Arial;
    font-size: 12px;
    padding: 7px;
}
h3 {
    color: yellow;
    text-align: center;
}
.box {
    border: 1px solid #00ff80;
    padding: 7px;
    margin-bottom: 7px;
    word-wrap: break-word;
}
button {
    width: 100%;
    padding: 10px;
    background: #008844;
    color: white;
    border: 0;
}
#error {
    color: red;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h3>TEST 8.12</h3>

<div class="box" id="status">STATUS: STARTING</div>
<div class="box" id="midlet">MIDlet API: CHECKING</div>
<div class="box" id="java">JAVA API: CHECKING</div>
<div class="box" id="installer">INSTALLER API: CHECKING</div>
<div class="box" id="filesystem">DEVICE FILESYSTEM: CHECKING</div>
<div class="box" id="cloud">CLOUD PHONE API: CHECKING</div>
<div class="box" id="other">OTHER INSTALL APIs: CHECKING</div>
<div class="box" id="result">RESULT: WAITING</div>

<div class="box">
ERROR DETAILS:
<div id="error">NONE</div>
</div>

<button onclick="runTest()">RUN TEST AGAIN</button>

<script>

var currentStep = "INITIALIZATION";

window.onerror = function(msg, url, line, column) {
    document.getElementById("status").innerHTML =
        "STATUS: ERROR";

    document.getElementById("error").innerHTML =
        "STEP: " + currentStep +
        "\nMESSAGE: " + msg +
        "\nLINE: " + line +
        "\nCOLUMN: " + column;

    return true;
};

function exists(obj, name) {
    try {
        return typeof obj[name] != "undefined";
    } catch(e) {
        return false;
    }
}

function runTest() {

    try {

        currentStep = "MIDLET API";

        var midletFound =
            exists(window, "MIDlet") ||
            exists(navigator, "MIDlet");

        document.getElementById("midlet").innerHTML =
            "MIDlet API: " +
            (midletFound ? "FOUND" : "NOT DETECTED");

        currentStep = "JAVA API";

        var javaFound =
            exists(window, "Java") ||
            exists(navigator, "javaEnabled");

        document.getElementById("java").innerHTML =
            "JAVA API: " +
            (javaFound ? "FOUND" : "NOT DETECTED");

        currentStep = "INSTALLER API";

        var installerFound =
            exists(navigator, "mozApps") ||
            exists(window, "InstallTrigger") ||
            exists(window, "MIDletInstaller");

        document.getElementById("installer").innerHTML =
            "INSTALLER API: " +
            (installerFound ? "POSSIBLE API FOUND" : "NOT DETECTED");

        currentStep = "DEVICE FILESYSTEM";

        var fsFound =
            exists(window, "requestFileSystem") ||
            exists(window, "webkitRequestFileSystem");

        document.getElementById("filesystem").innerHTML =
            "DEVICE FILESYSTEM API: " +
            (fsFound ? "API FOUND" : "NOT DETECTED");

        currentStep = "CLOUD PHONE API";

        var cloudFound =
            exists(navigator, "hasFeature") ||
            exists(navigator, "volumeManager");

        document.getElementById("cloud").innerHTML =
            "CLOUD PHONE API: " +
            (cloudFound ? "FOUND" : "NOT DETECTED");

        currentStep = "OTHER INSTALL APIs";

        var otherFound =
            exists(navigator, "getInstalledRelatedApps") ||
            exists(navigator, "registerProtocolHandler");

        document.getElementById("other").innerHTML =
            "OTHER WEB APIs: " +
            (otherFound ? "SOME APIs FOUND" : "NOT DETECTED");

        currentStep = "FINAL RESULT";

        document.getElementById("result").innerHTML =
            "RESULT: TEST COMPLETED\n\n" +
            "MIDlet API: " + (midletFound ? "FOUND" : "NOT DETECTED") +
            "\nJava API: " + (javaFound ? "FOUND" : "NOT DETECTED") +
            "\nInstaller API: " + (installerFound ? "FOUND" : "NOT DETECTED") +
            "\nFilesystem API: " + (fsFound ? "FOUND" : "NOT DETECTED") +
            "\n\nNOTE: Browser API detection cannot prove native installation support.";

        document.getElementById("status").innerHTML =
            "STATUS: TEST COMPLETED";

        document.getElementById("error").innerHTML = "NONE";

    } catch(e) {

        document.getElementById("status").innerHTML =
            "STATUS: TEST FAILED";

        document.getElementById("error").innerHTML =
            "STEP: " + currentStep +
            "\nERROR NAME: " + e.name +
            "\nERROR MESSAGE: " + e.message;
    }
}

runTest();

</script>
</body>
</html>
