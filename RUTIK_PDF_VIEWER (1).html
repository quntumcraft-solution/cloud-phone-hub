<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RUTIK PDF VIEWER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101827;color:#f4f7ff;font-family:Arial,sans-serif}
body{font-size:12px}
.app{width:100%;max-width:360px;min-height:100vh;margin:auto;display:flex;flex-direction:column;background:#152238}
header{padding:9px 8px;background:#0b1220;border-bottom:1px solid #30415e}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.5px}
.sub{font-size:10px;color:#a9bad4;margin-top:3px}
main{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.panel{background:#1d2d46;border:1px solid #344a69;border-radius:7px;padding:8px}
button,.pick{display:block;width:100%;border:0;border-radius:5px;padding:9px 6px;background:#2e7df6;color:white;font-size:12px;font-weight:bold;text-align:center;cursor:pointer}
button:focus,.pick:focus{outline:2px solid #fff;outline-offset:2px}
.secondary{background:#34445d}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#status{font-size:10px;color:#c4d2e7;line-height:1.5;margin-top:7px;overflow-wrap:anywhere}
#viewer{width:100%;height:52vh;min-height:115px;background:#fff;border:1px solid #6c7f9b;border-radius:4px}
#viewer iframe{width:100%;height:100%;border:0}
#empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#44536a;padding:8px;font-size:11px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.note{font-size:9px;color:#9eb0ca;line-height:1.4}
footer{text-align:center;padding:7px;color:#8294ad;font-size:9px}
@media(max-height:230px){#viewer{height:42vh;min-height:80px}main{gap:5px;padding:5px}.panel{padding:5px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>RUTIK PDF VIEWER</h1>
  <div class="sub">Select and read a PDF file</div>
</header>
<main>
  <section class="panel">
    <label class="pick" for="fileInput">CHOOSE PDF FILE</label>
    <input id="fileInput" type="file" accept="application/pdf,.pdf">
    <div id="status" aria-live="polite">No PDF selected. Press CHOOSE PDF FILE.</div>
  </section>
  <section class="panel">
    <div class="actions">
      <button id="openBtn" type="button">OPEN PDF</button>
      <button id="clearBtn" class="secondary" type="button">CLEAR</button>
    </div>
  </section>
  <section id="viewer">
    <div id="empty">PDF preview will appear here</div>
  </section>
  <div class="note">Note: Your browser must allow file selection and support PDF viewing. This page does not scan your phone storage automatically; you choose the file.</div>
</main>
<footer>RUTIK PDF VIEWER • Mobile edition</footer>
</div>
<script>
(function(){
  var input=document.getElementById('fileInput');
  var status=document.getElementById('status');
  var viewer=document.getElementById('viewer');
  var openBtn=document.getElementById('openBtn');
  var clearBtn=document.getElementById('clearBtn');
  var selected=null, objectUrl=null;

  function say(t){status.textContent=t;}
  function showEmpty(t){
    viewer.innerHTML='';
    var d=document.createElement('div');
    d.id='empty'; d.textContent=t;
    viewer.appendChild(d);
  }
  input.addEventListener('change',function(){
    if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
    selected=input.files && input.files[0] ? input.files[0] : null;
    if(!selected){say('No file selected.');showEmpty('PDF preview will appear here');return;}
    var isPdf=selected.type==='application/pdf'||/\.pdf$/i.test(selected.name);
    if(!isPdf){selected=null;say('Please choose a PDF file only.');showEmpty('Choose a PDF file');return;}
    var kb=(selected.size/1024).toFixed(1);
    say('Selected: '+selected.name+' ('+kb+' KB). Press OPEN PDF.');
  });
  openBtn.addEventListener('click',function(){
    if(!selected){say('First choose a PDF file.');return;}
    try{
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      objectUrl=URL.createObjectURL(selected);
      viewer.innerHTML='';
      var frame=document.createElement('iframe');
      frame.title='PDF preview';
      frame.src=objectUrl;
      viewer.appendChild(frame);
      say('Opening: '+selected.name);
    }catch(e){
      say('Could not open this PDF in the current browser.');
    }
  });
  clearBtn.addEventListener('click',function(){
    if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
    selected=null;input.value='';
    say('Cleared. Choose another PDF.');
    showEmpty('PDF preview will appear here');
  });
  window.addEventListener('beforeunload',function(){
    if(objectUrl)URL.revokeObjectURL(objectUrl);
  });
})();
</script>
</body>
</html>
