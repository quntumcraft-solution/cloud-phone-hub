<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cloud Phone Web Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff;color:#111;overflow:hidden}
body{font-size:14px}
#app{height:100%;display:flex;flex-direction:column}
header{height:30px;flex:0 0 30px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
#screen{flex:1;overflow:auto;padding:5px}
.item{border-bottom:1px solid #ddd;padding:5px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.selected{background:#111;color:#fff}
.num{display:inline-block;width:28px}
.cat{font-weight:bold;background:#eee;padding:4px;margin:2px 0}
footer{height:28px;flex:0 0 28px;border-top:1px solid #aaa;display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:12px}
#status{position:absolute;left:0;right:0;bottom:28px;background:#fff;border-top:1px solid #aaa;padding:5px;display:none}
button{font:inherit}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="app">
<header id="title">WEB HUB</header>
<div id="screen"></div>
<div id="status"></div>
<footer><span>Menu</span><span>OK / Back</span></footer>
</div>

["Tools","QR Code Generator","https://www.qr-code-generator.com/"]
];

let index=0, page="menu";

function render(){
  const screen=document.getElementById("screen");
  const title=document.getElementById("title");
  if(page==="menu"){
    title.textContent="WEB HUB";
    screen.innerHTML=sites.map((s,i)=>`<div class="item ${i===index?'selected':''}" data-i="${i}">
      <span class="num">${i+1}.</span>${s[1]}</div>`).join("");
    const el=screen.children[index];
    if(el) el.scrollIntoView({block:"nearest"});
  } else {
    title.textContent="OPENING...";
    screen.innerHTML="<div style='padding:8px'>Opening website...</div>";
  }
}
function openSelected(){
  const s=sites[index];
  // Top-level navigation is more compatible than iframe embedding.
  location.href=s[2];
}
function move(n){
  index=(index+n+sites.length)%sites.length;
  render();
}
document.addEventListener("keydown",e=>{
  if(page==="menu"){
    if(e.key==="ArrowDown"||e.key==="2") move(1);
    else if(e.key==="ArrowUp"||e.key==="8") move(-1);
    else if(e.key==="Enter"||e.key==="ArrowRight"||e.key==="5") openSelected();
    else if(e.key==="Home") {index=0;render();}
    else if(/^[0-9]$/.test(e.key)){
      let n=parseInt(e.key,10);
      if(n===0) n=10;
      if(n<=sites.length){index=n-1;render();}
    }
  }
});
document.addEventListener("click",e=>{
  const item=e.target.closest(".item");
  if(item){index=Number(item.dataset.i);render();openSelected();}
});
render();
</script>
</body>
</html>
